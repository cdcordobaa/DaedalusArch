name: CI

on:
  push:
    branches: [main, develop, v1.2e, 'v1.2e-*']
  pull_request:
    branches: [main, v1.2e]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.26-community@sha256:f66304b9511c60d33555a2c451f88e03d82d1ebc893f32d84c98a6b326096435
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/test-password
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Type check U0 tests
        run: npm run typecheck:u0-tests

      - name: Lint
        # D-U0-16: lint tooling broken at 7cd15b4; repaired in U0 Step 11, findings are a recorded residual
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          PIPELINE_MODE: stateless
          EVALUATION_MODE: symbolic-only

      - name: Integration tests
        run: npm run test:integration
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          PIPELINE_MODE: stateless
          EVALUATION_MODE: symbolic-only

      - name: Golden regression suite
        run: npm run test:golden
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          GOLDEN_REQUIRED: '1'

      - name: Firewall self-evaluation (symbolic-only)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: ./.github/actions/firewall
        with:
          project-path: '.'
          spec-path: 'specs/clean-arch.yaml'
          neo4j-password: 'test-password'
          evaluation-mode: 'symbolic-only'

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./coverage
          fail_ci_if_error: false
