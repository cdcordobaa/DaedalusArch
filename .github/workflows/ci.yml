name: CI

on:
  push:
    branches: [main, develop, v1.2e, 'v1.2e-*']
  pull_request:
    branches: [main, v1.2e]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:5.26-community@sha256:f66304b9511c60d33555a2c451f88e03d82d1ebc893f32d84c98a6b326096435
        ports:
          - 7474:7474
          - 7687:7687
        env:
          NEO4J_AUTH: neo4j/test-password
          NEO4J_PLUGINS: '["apoc"]'
          NEO4J_dbms_security_procedures_unrestricted: 'apoc.*'
        options: >-
          --health-cmd "wget --quiet --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 10
          --health-start-period 30s

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit
        # NFR-06: full report; stays report-only because accepted residuals still count as high here
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: Dependency audit gate (triaged)
        # NFR-06 promoted to blocking after the Build and Test Step 6 triage (Docs/DiagnosticRuns/bt-audit-triage.md):
        # fails on any high/critical advisory missing from scripts/lib/audit-allowlist.json
        run: npx tsx scripts/audit-gate-cli.ts

      - name: Type check
        run: npm run typecheck

      - name: Type check U0 tests
        run: npm run typecheck:u0-tests

      - name: Type check scripts
        # OI-U5b-P2-1: scripts/** and tests/unit/scripts/** (Build and Test Step 5)
        run: npx tsc -p tsconfig.scripts.json

      - name: Type check U3 tests
        # D-U4-14 (Build and Test Step 5)
        run: npx tsc -p tsconfig.u3-tests.json

      - name: Type check U4 tests
        # D-U4-14 (Build and Test Step 5)
        run: npx tsc -p tsconfig.u4-tests.json

      - name: Lint
        # D-U0-16: lint tooling broken at 7cd15b4; repaired in U0 Step 11, findings are a recorded residual
        continue-on-error: true
        run: npm run lint

      - name: Unit tests
        run: npm run test:unit
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          PIPELINE_MODE: stateless
          EVALUATION_MODE: symbolic-only

      - name: Integration tests
        run: npm run test:integration
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          PIPELINE_MODE: stateless
          EVALUATION_MODE: symbolic-only

      - name: Golden regression suite
        run: npm run test:golden
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          GOLDEN_REQUIRED: '1'

      - name: Full-mode golden lane (L0, Mock replay)
        # FR-30 (U4 Q16 A), BR-U4-CAS-10, CAS-11 (Build and Test Step 46): Mock judge in replay with PATH emptied, zero live
        # calls; a replay miss fails with "re-record: <n> missing keys"
        run: npm run test:golden:full
        env:
          NEO4J_URI: bolt://localhost:7687
          NEO4J_USER: neo4j
          NEO4J_PASSWORD: test-password
          GOLDEN_REQUIRED: '1'

      - name: Golden change log
        # BR-U1-41 / D-U1-5, widened by BR-U3-91 (D-U3-6) and Build and Test Step 5 (BT grammar): U1, U3, U4 and
        # Build and Test PRs; the self-test must fail to prove the CLI entry runs (D-U1-15)
        if: github.event_name == 'pull_request' && (startsWith(github.head_ref, 'v1.2e-u1-') || startsWith(github.head_ref, 'v1.2e-u3-') || startsWith(github.head_ref, 'v1.2e-u4-') || startsWith(github.head_ref, 'v1.2e-build-and-test'))
        run: |
          if npx tsx tests/golden/check-changes-log-cli.ts --self-test; then echo "change-log self-test did not fail"; exit 1; fi
          npx tsx tests/golden/check-changes-log-cli.ts

      - name: Pre-registration gate on every registered plan
        # ADR-021 item 7 (added with P-U6, prereg v4): on PRs to v1.2e, `--check-prereg` must print
        # "pre-registration v<N> ok" for every experiments/*/plan.json. A PR that changes a registered artefact
        # therefore carries its own dated bump (BR-U5b-50).
        if: github.event_name == 'pull_request' && github.base_ref == 'v1.2e'
        run: |
          status=0
          for plan in experiments/*/plan.json; do
            if ! npx tsx scripts/run-experiment-cli.ts --check-prereg "$plan"; then
              echo "::error file=$plan::--check-prereg refused $plan"
              status=1
            fi
          done
          exit $status

      - name: Firewall self-evaluation (symbolic-only)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        uses: ./.github/actions/firewall
        with:
          project-path: '.'
          spec-path: 'specs/clean-arch.yaml'
          neo4j-password: 'test-password'
          evaluation-mode: 'symbolic-only'

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          directory: ./coverage
          fail_ci_if_error: false
