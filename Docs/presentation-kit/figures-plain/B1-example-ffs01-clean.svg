<rect x="0" y="0" width="2300" height="940" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="30" y="20" width="900" height="430" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="50" y="68" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">1. What the team wrote</text><rect x="990" y="20" width="1280" height="430" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="1010" y="68" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">2. The query the tool generates</text><rect x="30" y="500" width="1340" height="420" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="50" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">3. The code that breaks it</text><text x="1350" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1B7F5A" text-anchor="end">green = added</text><rect x="1430" y="500" width="840" height="420" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="1450" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">4. What the tool reports</text><text x="50" y="120" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">architecture:</text><text x="50" y="158" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  style: clean-architecture</text><text x="50" y="196" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  layers:</text><text x="50" y="234" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    - name: domain</text><text x="50" y="272" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    - name: application</text><text x="50" y="310" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    - name: infrastructure</text><text x="50" y="348" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic"># … (folders, rule id omitted)</text><rect x="38" y="358" width="884" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="50" y="386" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">    name: dependency-direction</text><text x="50" y="424" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    severity: critical</text><text x="1010" y="120" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">MATCH (src:File)-[i:IMPORTS|RE_EXPORTS WHERE NOT</text><text x="1010" y="158" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    coalesce(i.viaReExport, false)]-&gt;(tgt:File)</text><text x="1010" y="196" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">WHERE src.layer IS NOT NULL AND tgt.layer IS NOT NULL</text><text x="1010" y="234" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">// …</text><text x="1010" y="272" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">     apoc.coll.indexOf(layerOrder, src.layer) AS srcIdx,</text><text x="1010" y="310" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">     apoc.coll.indexOf(layerOrder, tgt.layer) AS tgtIdx</text><rect x="998" y="320" width="1264" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="1010" y="348" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">WHERE srcIdx &gt;= 0 AND tgtIdx &gt;= 0 AND srcIdx &lt; tgtIdx</text><text x="1010" y="386" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">// …</text><text x="1010" y="424" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">// $layerOrder = [&quot;domain&quot;,&quot;application&quot;,&quot;infrastructure&quot;]</text><text x="50" y="600" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">import { Loan } from '../entities/Loan';</text><rect x="38" y="610" width="1324" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="50" y="638" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">import { SystemClock } from '../../infrastructure/system/SystemClock';</text><text x="50" y="676" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">// …</text><text x="50" y="714" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">export class LoanPolicy {</text><rect x="38" y="724" width="1324" height="38" rx="0" fill="#E9F5EE" stroke="none" stroke-width="1"/><text x="50" y="752" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  assertCanBorrowToday(member: Member, activeLoans: readonly Loan[]):</text><rect x="38" y="762" width="1324" height="38" rx="0" fill="#E9F5EE" stroke="none" stroke-width="1"/><text x="50" y="790" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    void {</text><rect x="38" y="800" width="1324" height="38" rx="0" fill="#E9F5EE" stroke="none" stroke-width="1"/><text x="50" y="828" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    this.assertCanBorrow(member, activeLoans, new SystemClock().now());</text><rect x="38" y="838" width="1324" height="38" rx="0" fill="#E9F5EE" stroke="none" stroke-width="1"/><text x="50" y="866" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  }</text><text x="50" y="904" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">// …</text><text x="1450" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Problem</text><text x="1660" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#C62828" text-anchor="start">the core imports infrastructure</text><text x="1450" y="644" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Rule</text><text x="1660" y="644" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">dependency direction</text><text x="1450" y="688" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Kind</text><text x="1660" y="688" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">defining rule (can fail)</text><text x="1450" y="732" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Where</text><text x="1660" y="732" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">LoanPolicy (core), line 4</text><text x="1450" y="776" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Imports</text><text x="1660" y="776" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">SystemClock (infrastructure)</text><text x="1450" y="820" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Answer key</text><text x="1660" y="820" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">expected: a correct report</text><line x1="936" y1="60" x2="980" y2="60" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="1850" y1="456" x2="1850" y2="490" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="1376" y1="540" x2="1420" y2="540" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/>
</svg>
