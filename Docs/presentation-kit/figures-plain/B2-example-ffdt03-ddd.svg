<svg xmlns="http://www.w3.org/2000/svg" width="2300" height="940" viewBox="0 0 2300 940">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
  <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6472"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker>
  <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B7F5A"/></marker>
  <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2F6DB5"/></marker>
  <marker id="arrP" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E5BB5"/></marker>
  <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="20" markerHeight="20" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C2671B"/></marker>
</defs>
<rect x="0" y="0" width="2300" height="940" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="30" y="20" width="900" height="430" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="50" y="68" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">1. What the team wrote</text><rect x="990" y="20" width="1280" height="430" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="1010" y="68" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">2. The query the tool generates</text><rect x="30" y="500" width="1340" height="420" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="50" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">3. The code that breaks it</text><rect x="1430" y="500" width="840" height="420" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="1450" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">4. What the tool reports</text><text x="50" y="120" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">architecture:</text><text x="50" y="158" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  style: ddd</text><text x="50" y="196" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  ddd:</text><text x="50" y="234" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">    # … (contexts, aggregates omitted)</text><text x="50" y="272" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    value_objects: [&quot;src/**/value-objects/**&quot;]</text><text x="50" y="310" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic"># … (rule id omitted)</text><rect x="38" y="320" width="884" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="50" y="348" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">    name: value-object-immutability</text><text x="50" y="386" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    severity: critical</text><text x="1010" y="120" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">MATCH (c:Class)</text><text x="1010" y="158" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">WHERE ANY(p IN $valueObjectPatterns WHERE c.filePath =~ p)</text><text x="1010" y="196" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">WITH c,</text><text x="1010" y="234" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">// …</text><rect x="998" y="244" width="1264" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="1010" y="272" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">     + [s IN coalesce(c.setAccessors, []) | c.name + '.' + s + '</text><rect x="998" y="282" width="1264" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="1010" y="310" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">    (set accessor)']</text><text x="1010" y="348" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">// …</text><text x="1010" y="386" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">WHERE size(members) &gt; 0</text><text x="1010" y="424" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">// …</text><text x="50" y="600" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">export class Quantity {</text><text x="50" y="638" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  private current: number;</text><text x="50" y="676" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  constructor(value: number) { /* … validates, then */ this.current =</text><text x="50" y="714" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    value; }</text><text x="50" y="752" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  get value(): number { return this.current; }</text><rect x="38" y="762" width="1324" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="50" y="790" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">  set value(v: number) {</text><text x="50" y="828" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    this.current = v;</text><text x="50" y="866" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  }</text><text x="50" y="904" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">  // … plus(other) returns a new Quantity</text><text x="1450" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Problem</text><text x="1660" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#C62828" text-anchor="start">Quantity can be changed after it is</text><text x="1660" y="638" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#C62828" text-anchor="start">made</text><text x="1450" y="682" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Rule</text><text x="1660" y="682" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">value objects never change</text><text x="1450" y="726" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Kind</text><text x="1660" y="726" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">defining rule (can fail)</text><text x="1450" y="770" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Where</text><text x="1660" y="770" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">Quantity.value (set accessor)</text><text x="1450" y="814" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">First run</text><text x="1660" y="814" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">missed</text><text x="1450" y="858" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Now</text><text x="1660" y="858" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">found; DDD 8/9 → 9/9 found</text><line x1="936" y1="60" x2="980" y2="60" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="1850" y1="456" x2="1850" y2="490" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="1376" y1="540" x2="1420" y2="540" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/>
</svg>
