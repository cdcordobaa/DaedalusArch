<rect x="0" y="0" width="2300" height="940" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<rect x="30" y="20" width="900" height="430" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="50" y="68" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">1. What the team wrote</text><rect x="990" y="20" width="1280" height="430" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="1010" y="68" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">2. The query the tool generates</text><rect x="30" y="500" width="1340" height="420" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="50" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">3. The code that breaks it</text><text x="1350" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1B7F5A" text-anchor="end">green = added</text><rect x="1430" y="500" width="840" height="420" rx="14" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="2"/><text x="1450" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="32" font-weight="700" fill="#1F2937" text-anchor="start">4. What the tool reports</text><text x="50" y="120" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  style: hexagonal</text><text x="50" y="158" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">  # … (5 layers omitted)</text><text x="50" y="196" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  allowed_dependencies:</text><text x="50" y="234" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    - from: application</text><text x="50" y="272" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">      to: [domain]</text><rect x="38" y="282" width="884" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="50" y="310" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">    - from: adapters-inbound</text><text x="50" y="348" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">      to: [application, domain]</text><text x="50" y="386" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">    # …</text><text x="50" y="424" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    name: layer-skip-graph</text><text x="1010" y="120" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">MATCH (src:File)-[i:IMPORTS|RE_EXPORTS WHERE NOT</text><text x="1010" y="158" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    coalesce(i.viaReExport, false)]-&gt;(tgt:File)</text><text x="1010" y="196" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">WHERE src.layer IS NOT NULL AND tgt.layer IS NOT NULL</text><text x="1010" y="234" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  AND src.layer &lt;&gt; tgt.layer</text><rect x="998" y="244" width="1264" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="1010" y="272" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">  AND NOT (src.layer + '&gt;' + tgt.layer) IN $allowedDependencies</text><rect x="998" y="282" width="1264" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="1010" y="310" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">  AND NOT (tgt.layer + '&gt;' + src.layer) IN $allowedDependencies</text><text x="1010" y="348" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">// …</text><text x="50" y="600" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#5B6472" xml:space="preserve" font-style="italic">// …</text><rect x="38" y="610" width="1324" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="50" y="638" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">import { InMemoryRoomRepository } from</text><rect x="38" y="648" width="1324" height="38" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="50" y="676" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#C62828" xml:space="preserve">    '../../outbound/persistence/InMemoryRoomRepository';</text><text x="50" y="714" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve"></text><text x="50" y="752" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">export class RoomController {</text><text x="50" y="790" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  constructor(</text><text x="50" y="828" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">    private readonly findAvailableRooms: FindAvailableRooms,</text><rect x="38" y="838" width="1324" height="38" rx="0" fill="#E9F5EE" stroke="none" stroke-width="1"/><text x="50" y="866" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">   private readonly roomStore: InMemoryRoomRepository,</text><text x="50" y="904" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="30" fill="#1F2937" xml:space="preserve">  ) {}</text><text x="1450" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Problem</text><text x="1660" y="600" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#C62828" text-anchor="start">web adapter imports the storage</text><text x="1660" y="638" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#C62828" text-anchor="start">adapter sideways</text><text x="1450" y="682" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Kind</text><text x="1660" y="682" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">warning (never fails) in Hexagonal</text><text x="1450" y="726" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Author key</text><text x="1660" y="726" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">warning</text><text x="1450" y="770" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Blind key</text><text x="1660" y="770" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">defining rule (can fail)</text><text x="1450" y="814" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">Open</text><text x="1660" y="814" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">should it fail? not decided yet</text><line x1="936" y1="60" x2="980" y2="60" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="1850" y1="456" x2="1850" y2="490" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="1376" y1="540" x2="1420" y2="540" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/>
</svg>
