<rect x="0" y="0" width="2300" height="940" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="40" y="50" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">WHAT THE TEAM WROTE</text><text x="40" y="500" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#5B6472" text-anchor="start">THE CODE</text><rect x="40" y="80" width="400" height="330" rx="14" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="3"/><text x="62" y="130.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#2F6DB5" text-anchor="start">The spec</text><text x="62" y="178.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">layers and their</text><text x="62" y="216.78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">folders</text><text x="62" y="259.18" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">allowed dependencies</text><text x="62" y="301.58" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">which rules apply</text><rect x="520" y="80" width="400" height="330" rx="14" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="3"/><text x="542" y="130.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#2F6DB5" text-anchor="start">Compiler</text><text x="542" y="178.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">turns each rule into a</text><text x="542" y="216.78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">query on the map</text><rect x="1000" y="80" width="400" height="330" rx="14" fill="#FFFFFF" stroke="#2F6DB5" stroke-width="3"/><text x="1022" y="130.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#2F6DB5" text-anchor="start">Queries</text><text x="1022" y="178.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">one per rule, e.g. “no</text><text x="1022" y="216.78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">import may point</text><text x="1022" y="255.18" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">outward”</text><rect x="40" y="530" width="400" height="330" rx="14" fill="#FFFFFF" stroke="#1B7F5A" stroke-width="3"/><text x="62" y="580.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1B7F5A" text-anchor="start">TypeScript code</text><text x="62" y="628.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">the project as</text><text x="62" y="666.78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">written, by a team or</text><text x="62" y="705.18" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">by an AI</text><rect x="520" y="530" width="400" height="330" rx="14" fill="#FFFFFF" stroke="#1B7F5A" stroke-width="3"/><text x="542" y="580.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1B7F5A" text-anchor="start">Extractor</text><text x="542" y="628.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">reads the code with</text><text x="542" y="666.78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">the TypeScript</text><text x="542" y="705.18" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">compiler</text><rect x="1000" y="530" width="400" height="330" rx="14" fill="#FFFFFF" stroke="#1B7F5A" stroke-width="3"/><text x="1022" y="580.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1B7F5A" text-anchor="start">The tool’s map</text><text x="1022" y="628.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">files, classes,</text><text x="1022" y="666.78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">methods, each with its</text><text x="1022" y="705.18" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">layer; imports, calls,</text><text x="1022" y="743.5799999999999" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">…</text><line x1="448" y1="245" x2="510" y2="245" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="448" y1="695" x2="510" y2="695" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="928" y1="245" x2="990" y2="245" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="928" y1="695" x2="990" y2="695" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><rect x="1470" y="230" width="310" height="450" rx="14" fill="#F6F8FA" stroke="#1F2937" stroke-width="3"/><text x="1492" y="280.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start">Run the</text><text x="1492" y="322.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start">queries</text><text x="1492" y="369.86" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">each row a query</text><text x="1492" y="408.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">returns is a</text><text x="1492" y="446.65999999999997" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">finding</text><text x="1492" y="489.05999999999995" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">same code, same</text><text x="1492" y="527.4599999999999" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">rows</text><line x1="1408" y1="245" x2="1460" y2="305" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="1408" y1="695" x2="1460" y2="635" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><rect x="1830" y="40" width="430" height="290" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><text x="1852" y="90.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start">Findings</text><text x="1852" y="138.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#C62828" text-anchor="start">defining rule (can fail)</text><text x="1852" y="180.78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#5B6472" text-anchor="start">warning (never fails)</text><rect x="1830" y="380" width="430" height="250" rx="14" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="3" stroke-dasharray="12 8"/><text x="1852" y="430.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#8E5BB5" text-anchor="start">AI reviewer</text><text x="1852" y="478.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">reads the code, reports,</text><text x="1852" y="516.78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">never fails</text><rect x="1830" y="680" width="430" height="220" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="3"/><text x="1852" y="730.9" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start">Verdict</text><text x="1852" y="778.38" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">fails on any</text><text x="1852" y="816.78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">defining-rule finding</text><line x1="1788" y1="455" x2="1820" y2="185" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="2045" y1="334" x2="2045" y2="374" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/><line x1="2045" y1="634" x2="2045" y2="674" stroke="#1F2937" stroke-width="4" marker-end="url(#arr)"/>
</svg>
