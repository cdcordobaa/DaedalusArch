family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">violations, 14 look-alikes, 5 clean apps.</text></g><rect x="1110" y="184" width="109" height="42" rx="21" fill="#1B7F5A" stroke="none" stroke-width="1"/><text x="1127" y="214.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">built</text><rect x="30" y="312" width="250" height="161" rx="14" fill="#C2671B" stroke="none" stroke-width="1"/><text x="52" y="354" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="start">Link 3</text><text x="52" y="394" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="start">Rules</text><rect x="310" y="312" width="1090" height="161" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="2"/><g transform="translate(0,360)"><text x="332" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">Defining rules, author key: 54/54 found</text><text x="332" y="39" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">(0.93–1.00). Blind key: 50/64 found, 50/54</text><text x="332" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">reports right.</text></g><rect x="1110" y="328" width="94" height="42" rx="21" fill="#1B7F5A" stroke="none" stroke-width="1"/><text x="1127" y="358.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">done</text><rect x="1110" y="382" width="215" height="42" rx="21" fill="#C2671B" stroke="none" stroke-width="1"/><text x="1127" y="412.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">39 to decide</text><rect x="30" y="495" width="250" height="297" rx="14" fill="#8E5BB5" stroke="none" stroke-width="1"/><text x="52" y="537" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#fff" text-anchor="start">Link 4</text><text x="52" y="577" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="start">Meaning</text><rect x="310" y="495" width="1090" height="161" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="2"/><g transform="translate(0,543)"><text x="332" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">AI reviewer, two clean problem types: 16/21 =</text><text x="332" y="39" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">0.76 (0.55–0.89). 30/35 includes confounded</text><text x="332" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">cases.</text></g><rect x="1110" y="511" width="94" height="42" rx="21" fill="#1B7F5A" stroke="none" stroke-width="1"/><text x="1127" y="541.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">done</text><rect x="310" y="668" width="1090" height="124" rx="12" fill="#fff" stroke="#E5E7EB" stroke-width="2"/><g transform="translate(0,716)"><text x="332" y="0" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="400" fill="#1F2937" text-anchor="start">Human labels and the sealed test: not run yet.</text></g><rect x="1110" y="684" width="140" height="42" rx="21" fill="#C2671B" stroke="none" stroke-width="1"/><text x="1127" y="714.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">not run</text><rect x="1110" y="738" width="152" height="42" rx="21" fill="#5B6472" stroke="none" stroke-width="1"/><g transform="translate(1124,746) scale(1)"><rect x="0" y="9" width="18" height="14" rx="3" fill="#FFFFFF"/><path d="M4 9 V6 a5 5 0 0 1 10 0 V9" fill="none" stroke="#FFFFFF" stroke-width="2.6"/></g><text x="1154.3" y="768.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">sealed</text><rect x="30" y="820" width="441" height="42" rx="21" fill="#1B7F5A" stroke="none" stroke-width="1"/><text x="47" y="850.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">done on the development set</text><rect x="493" y="820" width="275" height="42" rx="21" fill="#C2671B" stroke="none" stroke-width="1"/><text x="510" y="850.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">defined, not run</text><rect x="790" y="820" width="152" height="42" rx="21" fill="#5B6472" stroke="none" stroke-width="1"/><g transform="translate(804,828) scale(1)"><rect x="0" y="9" width="18" height="14" rx="3" fill="#FFFFFF"/><path d="M4 9 V6 a5 5 0 0 1 10 0 V9" fill="none" stroke="#FFFFFF" stroke-width="2.6"/></g><text x="834.3" y="850.1" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" text-anchor="start">sealed</text>
