<text x="40" y="56" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#5B6472" text-anchor="start">Imports where the tool and the TypeScript compiler disagree, by cause</text><text x="270" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2937" text-anchor="end">AI-built projects</text><text x="270" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6472" text-anchor="end">72 projects</text><rect x="290" y="120" width="860" height="100" rx="0" fill="#2F6DB5" stroke="none" stroke-width="1"/><text x="720" y="180" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">39</text><text x="1174" y="162" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start">39</text><text x="1174" y="202" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B7F5A" text-anchor="start">unexplained: 0</text><text x="290" y="260" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6472" text-anchor="start">99.7% of the compiler’s imports found</text><text x="270" y="392" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1F2937" text-anchor="end">7 real codebases</text><text x="270" y="430" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6472" text-anchor="end">from Study 1</text><rect x="290" y="350" width="249.6404793608522" height="100" rx="0" fill="#2F6DB5" stroke="none" stroke-width="1"/><text x="414.8202396804261" y="410" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">218</text><rect x="539.6404793608522" y="350" width="231.31824234354193" height="100" rx="0" fill="#8E5BB5" stroke="none" stroke-width="1"/><text x="655.2996005326231" y="410" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">202</text><rect x="770.9587217043941" y="350" width="376.75099866844204" height="100" rx="0" fill="#C2671B" stroke="none" stroke-width="1"/><text x="959.334221038615" y="410" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#fff" text-anchor="middle">329</text><rect x="1147.709720372836" y="350" width="4" height="100" rx="0" fill="#1B7F5A" stroke="none" stroke-width="1"/><text x="1174" y="392" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start">751</text><text x="1174" y="432" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="700" fill="#1B7F5A" text-anchor="start">unexplained: 0</text><text x="290" y="490" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#5B6472" text-anchor="start">96.6% of the compiler’s imports found</text><rect x="290" y="557.9" width="30" height="22.099999999999998" rx="4" fill="#2F6DB5" stroke="none" stroke-width="1"/><text x="332" y="580" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">re-exports through index files</text><rect x="789.4000000000001" y="557.9" width="30" height="22.099999999999998" rx="4" fill="#8E5BB5" stroke="none" stroke-width="1"/><text x="831.4000000000001" y="580" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">files left out on purpose (tests, data)</text><rect x="290" y="609.9" width="30" height="22.099999999999998" rx="4" fill="#C2671B" stroke="none" stroke-width="1"/><text x="332" y="632" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">imports from outside the project folder</text><rect x="913.4200000000001" y="609.9" width="30" height="22.099999999999998" rx="4" fill="#1B7F5A" stroke="none" stroke-width="1"/><text x="955.4200000000001" y="632" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="26" font-weight="400" fill="#1F2937" text-anchor="start">type-declaration files</text><rect x="40" y="700" width="1350" height="150" rx="14" fill="#F6F8FA" stroke="none" stroke-width="1"/><text x="70" y="760" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="700" fill="#1F2937" text-anchor="start">The one cause the tool should handle, index files, was fixed:</text><text x="70" y="808" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="28" font-weight="400" fill="#1F2937" text-anchor="start">the two AI-built projects that disagreed now match exactly (overlap 1.000).</text>
