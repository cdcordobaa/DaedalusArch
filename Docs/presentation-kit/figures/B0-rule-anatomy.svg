serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >tier in hexagonal: blocking</text><line x1="790" y1="360" x2="808" y2="360" stroke="#1F2937" stroke-width="3" marker-end="url(#arr)"/><rect x="816" y="170" width="352" height="380" rx="14" fill="#FFFFFF" stroke="#C2671B" stroke-width="2.5"/><rect x="816" y="170" width="352" height="62" rx="14" fill="#C2671B" stroke="none" stroke-width="1"/><rect x="816" y="218" width="352" height="14" rx="0" fill="#C2671B" stroke="none" stroke-width="1"/><text x="834" y="200" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff" text-anchor="start" >3 · Cypher</text><text x="834" y="222" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#fff" text-anchor="start" >compiled, run on the APG</text><text x="832" y="266" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">MATCH (src:File)-[i:IMPORTS|</text><text x="832" y="290" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">      RE_EXPORTS]-&gt;(tgt:File)</text><text x="832" y="314" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">WHERE NOT i.viaReExport</text><text x="832" y="338" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve"> AND src.layer &lt;&gt; tgt.layer</text><text x="832" y="362" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve"> AND NOT (src.layer+&quot;&gt;&quot;+tgt.layer)</text><text x="832" y="386" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">     IN $allowedDependencies</text><text x="832" y="410" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve"> AND (tgt.layer+&quot;&gt;&q