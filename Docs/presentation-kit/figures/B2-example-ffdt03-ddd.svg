: FF-DT03</text><rect x="54" y="365.09999999999997" width="548" height="21.299999999999997" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="62" y="379.09999999999997" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#C62828" xml:space="preserve">    name: value-object-immutability</text><text x="62" y="400.4" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">    dimension: pattern</text><text x="62" y="421.7" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">    severity: critical</text><text x="62" y="443" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">    route: symbolic</text><text x="62" y="464.29999999999995" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">    tier: blocking</text><rect x="664" y="160" width="888" height="376.26" rx="12" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="1.5"/><circle cx="690" cy="188" r="15" fill="#1F2937"/><text x="690" y="194" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="716" y="195" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1F2937" text-anchor="start" >Compiled Cypher</text><text x="1536" y="195" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6472" text-anchor="end" >real compiler output, trimmed</text><text x="678" y="230" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">MATCH (c:Class)</text><text x="678" y="250.59" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">WHERE ANY(p IN $valueObjectPatterns WHERE c.filePath =~ p)</text><text x="678" y="271.18" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">WITH c,</text><text x="678" y="291.77" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">     [f IN coalesce(c.publicFields, [])</text><text x="678" y="312.36" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">        WHERE NOT f IN coalesce(c.readonlyFields, []) AND NOT f IN coalesce(c.staticFields, []) | </text><text x="678" y="332.95" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">    c.name + '.' + f + ' (public mutable field)']</text><rect x="670" y="340.03999999999996" width="876" height="20.59" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="678" y="353.53999999999996" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#C62828" xml:space="preserve">     + [s IN coalesce(c.setAccessors, []) | c.name + '.' + s + ' (set accessor)']</text><text x="678" y="374.13" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">     + [m IN coalesce(c.mutatorMethods, []) | c.name + '.' + m + ' (mutator method)'] AS members</text><text x="678" y="394.72" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">WHERE size(members) &gt; 0</text><text x="678" y="415.31" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">RETURN c.filePath AS filePath, c.name AS class, reduce(acc = head(members), x IN tail(members) | a</text><text x="678" y="435.9" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">    cc + ', ' + x) AS method,</text><text x="678" y="456.49" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#9CA3AF" xml:space="preserve" font-style="italic">// … (RETURN of 4 columns and ORDER BY omitted)</text><text x="678" y="477.08" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve"></text><text x="678" y="497.67" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="14.5" fill="#1F2937" xml:space="preserve">// $valueObjectPatterns = [&quot;^src/(?:.*/)?value-objects/.*$&quot;]</text><rect x="48" y="592.26" width="820" height="385" rx="12" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="1.5"/><circle cx="74" cy="620.26" r="15" fill="#1F2937"/><text x="74" y="626.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="100" y="627.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1F2937" text-anchor="start" >Code that violates it</text><text x="852" y="627.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6472" text-anchor="end" >probe g01 (overlay)</text><text x="62" y="662.26" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">// src/ordering/domain/value-objects/Quantity.ts</text><text x="62" y="683.56" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">export class Quantity {</text><text x="62" y="704.86" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">  private current: number;</text><text x="62" y="726.16" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">  constructor(value: number) { /* … validates, then */ this.current = value; }</text><text x="62" y="747.46" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">  get value(): number { return this.current; }</text><text x="62" y="768.76" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve"></text><rect x="54" y="776.06" width="808" height="21.299999999999997" rx="0" fill="#FDECEC" stroke="none" stroke-width="1"/><text x="62" y="790.06" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#C62828" xml:space="preserve">  set value(v: number) {</text><text x="62" y="811.3599999999999" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">    this.current = v;</text><text x="62" y="832.66" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#1F2937" xml:space="preserve">  }</text><text x="62" y="853.96" font-family="Menlo, 'SF Mono', Consolas, monospace" font-size="15" fill="#9CA3AF" xml:space="preserve" font-style="italic">  // … plus(other) returns a new Quantity</text><rect x="924" y="592.26" width="628" height="385" rx="12" fill="#FBFBFC" stroke="#D7DCE3" stroke-width="1.5"/><circle cx="950" cy="620.26" r="15" fill="#1F2937"/><text x="950" y="626.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="976" y="627.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#1F2937" text-anchor="start" >What the tool reports</text><text x="1536" y="627.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#5B6472" text-anchor="end" >FF-DT03 · blocking</text><text x="942" y="664.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#5B6472" text-anchor="start" >before</text><text x="1092" y="664.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1F2937" text-anchor="start" >after-fixes run: no finding (miss M3)</text><text x="942" y="696.26" font-family="'Helvetica Neue', Helv