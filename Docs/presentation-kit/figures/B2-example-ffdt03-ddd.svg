'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#C62828" text-anchor="start" >mutable through Quantity.value (set accessor)</text><text x="942" y="902.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#5B6472" text-anchor="start" >effect</text><text x="1092" y="902.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >DDD blocking recall 8/9 → 9/9; pooled 56/57 →</text><text x="1092" y="925.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >57/57</text><line x1="614" y1="200" x2="656" y2="200" stroke="#1F2937" stroke-width="3" marker-end="url(#arr)"/><text x="636" y="188" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6472" text-anchor="middle" >compile</text><line x1="1238" y1="542.26" x2="1238" y2="584.26" stroke="#1F2937" stroke-width="3" marker-end="url(#arr)"/><text x="1250" y="569.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6472" text-anchor="start" >run on the graph</text><line x1="874" y1="632.26" x2="916" y2="632.26" stroke="#1F2937" stroke-width="3" marker-end="url(#arr)"/><text x="896" y="620.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#5B6472" text-anchor="middle" >extract</text><rect x="48" y="1001.26" width="1504" height="97" rx="10" fill="#FEF3C7" stroke="none" stroke-width="1"/><text x="66" y="1026.26" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="18" font-weight="400" fill="#1F2937" text-anchor="start" >Why it was missed: the v1.2E graph had no member facts, so a setter could only be found by its method name (setX). Member facts (readonly, set accessors,</text><text x="66" y="1051.26" font-family=