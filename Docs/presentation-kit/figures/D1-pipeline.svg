<text x="48" y="62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start" >How the firewall works: code in, verdict out</text>
<text x="48" y="98" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5B6472" text-anchor="start" >The spec becomes graph queries; the code becomes a graph; findings are the rows the queries return. The judge adds a reported, non-blocking reading.</text>
