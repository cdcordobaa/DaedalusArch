<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="911" viewBox="0 0 1600 911">
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1F2937"/></marker>
  <marker id="arrM" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5B6472"/></marker>
  <marker id="arrR" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="12" markerHeight="12" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#C62828"/></marker>
</defs>
<rect x="0" y="0" width="1600" height="911" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/>
<text x="48" y="62" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#1F2937" text-anchor="start" >A layered neuro-symbolic design</text>
<text x="48" y="98" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="400" fill="#5B6472" text-anchor="start" >Deterministic facts first, cheap proxies next, the LLM last and only where code meaning is needed. Status chips as of 2026-10-15.</text>
<rect x="1375" y="32" width="177" height="28" rx="14" fill="#EEF2F7" stroke="#5B6472" stroke-width="1"/><text x="1463.5" y="51.4" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#5B6472" text-anchor="middle" >DESIGN + STATUS</text>
<rect x="48" y="160" width="1504" height="132" rx="14" fill="#FFFFFF" stroke="#1F2937" stroke-width="2.5"/><rect x="48" y="160" width="74" height="132" rx="14" fill="#1F2937" stroke="none" stroke-width="1"/><rect x="108" y="160" width="14" height="132" rx="0" fill="#1F2937" stroke="none" stroke-width="1"/><text x="85" y="240" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle" >4</text><text x="148" y="198" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1F2937" text-anchor="start" >Rules over both</text><text x="148" y="228" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Cypher rules that read graph facts and, later, the semantic layers' outputs as ordinary node and edge properties.</text><text x="148" y="278" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6472" text-anchor="start" font-style="italic" >today: symbolic rules only; the judge is reported, never blocks</text><rect x="1402" y="178" width="130" height="26" rx="13" fill="#C2671B" stroke="none" stroke-width="1"/><text x="1415" y="196" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" >partly built</text><line x1="800" y1="316" x2="800" y2="296" stroke="#5B6472" stroke-width="2.5" marker-end="url(#arrM)"/><rect x="48" y="320" width="1504" height="132" rx="14" fill="#FFFFFF" stroke="#8E5BB5" stroke-width="2.5"/><rect x="48" y="320" width="74" height="132" rx="14" fill="#8E5BB5" stroke="none" stroke-width="1"/><rect x="108" y="320" width="14" height="132" rx="0" fill="#8E5BB5" stroke="none" stroke-width="1"/><text x="85" y="400" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle" >3</text><text x="148" y="358" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#8E5BB5" text-anchor="start" >LLM judge  ·  grounded ontology</text><text x="148" y="388" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Frozen LLM judge reads one unit of code against the spec for integrity (FF-N01) and intent (FF-N02). An ontology grounded in the</text><text x="148" y="410" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >graph would name roles and concepts.</text><text x="148" y="438" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6472" text-anchor="start" font-style="italic" >judge: frozen, 13/16 unconfounded seeds, 30/35 all (dev)  ·  ontology: not built live</text><rect x="1349" y="338" width="183" height="26" rx="13" fill="#AEB6C2" stroke="none" stroke-width="1"/><text x="1362" y="356" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" >ontology not built</text><rect x="1096" y="338" width="243" height="26" rx="13" fill="#1B7F5A" stroke="none" stroke-width="1"/><text x="1109" y="356" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" >judge measured on dev set</text><line x1="800" y1="476" x2="800" y2="456" stroke="#5B6472" stroke-width="2.5" marker-end="url(#arrM)"/><rect x="48" y="480" width="1504" height="132" rx="14" fill="#FFFFFF" stroke="#C2671B" stroke-width="2.5"/><rect x="48" y="480" width="74" height="132" rx="14" fill="#C2671B" stroke="none" stroke-width="1"/><rect x="108" y="480" width="14" height="132" rx="0" fill="#C2671B" stroke="none" stroke-width="1"/><text x="85" y="560" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle" >2</text><text x="148" y="518" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#C2671B" text-anchor="start" >Cheap semantic proxies (pass 0.5)</text><text x="148" y="548" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Deterministic code analysis proposes candidate sites: clones, shared literals, persistence or framework in the core, repository</text><text x="148" y="570" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >bypass, logic density, cohesion. No LLM; ~50–130 ms per project.</text><text x="148" y="598" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6472" text-anchor="start" font-style="italic" >11/11 round-1 seeds but 2/9 on E1 DUP-RULE copies: a candidate generator, not a verdict</text><rect x="1332" y="498" width="200" height="26" rx="13" fill="#1B7F5A" stroke="none" stroke-width="1"/><text x="1345" y="516" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" >prototype on dev set</text><line x1="800" y1="636" x2="800" y2="616" stroke="#5B6472" stroke-width="2.5" marker-end="url(#arrM)"/><rect x="48" y="640" width="1504" height="132" rx="14" fill="#FFFFFF" stroke="#1B7F5A" stroke-width="2.5"/><rect x="48" y="640" width="74" height="132" rx="14" fill="#1B7F5A" stroke="none" stroke-width="1"/><rect x="108" y="640" width="14" height="132" rx="0" fill="#1B7F5A" stroke="none" stroke-width="1"/><text x="85" y="720" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="40" font-weight="700" fill="#fff" text-anchor="middle" >1</text><text x="148" y="678" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#1B7F5A" text-anchor="start" >Symbolic facts: the APG</text><text x="148" y="708" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Extractor writes files, classes, methods, packages and typed edges (imports, implements, injects, calls, data flow); APG v2 adds</text><text x="148" y="730" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >signatures, components, channels, I/O.</text><text x="148" y="758" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6472" text-anchor="start" font-style="italic" >graph agrees with tsc (99.7% / 99.2% on E1); 54/54 blocking rows on the dev set (3 N/A)</text><rect x="1375" y="658" width="157" height="26" rx="13" fill="#1B7F5A" stroke="none" stroke-width="1"/><text x="1388" y="676" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="start" >done on dev set</text><text x="816" y="796" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6472" text-anchor="start" >each layer feeds the one above; the cheaper layer runs first</text>
<text x="48" y="845" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6472" text-anchor="start" >Sources: layer 1 Docs/DiagnosticRuns/v1.3-graph-fidelity-2026-10-14.md, v1.3-reference-after-member-facts-2026-10-15.md; layer 2 Docs/v1.3/cheap-semantics-design.md (&quot;Purpose&quot;),</text>
<text x="48" y="866" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6472" text-anchor="start" >Docs/DiagnosticRuns/cheap-semantics-2026-10-15.md, v1.3-duprule-v2-2026-10-15.md §5;</text>
<text x="48" y="887" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#5B6472" text-anchor="start" >layer 3 Docs/DiagnosticRuns/v1.3-duprule-v2-2026-10-15.md §3 (judge); the grounded ontology has no committed design or run; layer 4 Docs/v1.3/rule-tiers.md (judge never blocks).</text>
</svg>