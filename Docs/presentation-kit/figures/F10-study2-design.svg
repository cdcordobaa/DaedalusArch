7" font-weight="400" fill="#1F2937" text-anchor="start" >Working grid (a guess, not registered): 6 sealed tasks × 2–3 models × 3 replicates × 3 arms ≈ 162 runs; 54 blocks detect d_z ≈ 0.42.</text><text x="66" y="784" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" >If the pilot finds no blocking erosion in the none arm, the primary outcome becomes the advisory erosion rate (F11).</text>
