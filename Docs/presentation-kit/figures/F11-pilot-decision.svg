ue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B7F5A" text-anchor="start" >YES: erosion exists</text><rect x="48" y="590" width="640" height="250" rx="12" fill="#FFFFFF" stroke="#C62828" stroke-width="2"/><text x="66" y="624" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#C62828" text-anchor="start" >Primary outcome → advisory-tier erosion rate</text><text x="66" y="653" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Per-run OLS slope of advisory findings per KLOC over steps 1–4,</text><text x="66" y="675.44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >FF-CV05 excluded.</text><text x="66" y="701.8800000000001" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Why: deterministic, no new validity question, the tier where Study</text><text x="66" y="724.3200000000002" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >1's differences lived.</text><text x="66" y="750.7600000000002" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Cost: a claim about design-quality signals, not defining</text><text x="66" y="773.2000000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >constraints. gate must get the advisory subset, or be dropped (keep</text><text x="66" y="795.6400000000003" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >daedalus-mcp vs none).</text><rect x="912" y="590" width="640" height="250" rx="12" fill="#FFFFFF" stroke="#1B7F5A" stroke-width="2"/><text x="930" y="624" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1B7F5A" text-anchor="start" >Primary outcome stays → blocking violations per step</text><text x="930" y="653" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Blocking violations per step and their slope, as in the Study 2</text><text x="930" y="675.44" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >outline §4.</text><text x="930" y="701.8800000000001" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >The advisory rate becomes a secondary outcome.</text><text x="930" y="728.3200000000002" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Judge dimensions stay secondary in both branches.</text><rect x="48" y="860" width="1504" height="64" rx="10" fill="#F6F8FA" stroke="none" stroke-width="1"/><text x="66" y="887" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Committed in advance: no other pilot result may change Study 2's primary outcome; nothing in the gate arm or in any arm difference can.</text><text x="66" y="911" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" >Context: under v1.3 tiers every E1 finding was advisory (F9), so &quot;zero&quot; is a live possibility.</text>
