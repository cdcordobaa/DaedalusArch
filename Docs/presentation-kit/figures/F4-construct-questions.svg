" font-weight="400" fill="#1F2937" text-anchor="start" >ddd</text><text x="1120" y="562" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F6DB5" text-anchor="start" >B / A: keep the tier; report</text><text x="1120" y="584" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F6DB5" text-anchor="start" >the unsupported half as N/A</text><text x="1410" y="562" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >report N/A</text><text x="1410" y="584" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >half</text><rect x="48" y="600" width="1504" height="66" rx="0" fill="#FFFFFF" stroke="none" stroke-width="1"/><text x="60" y="628" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start" >Q6</text><text x="170" y="628" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >Does hexagonal core-isolation (FF-S04) cover the</text><text x="170" y="650" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >application layer?</text><text x="690" y="628" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >2</text><text x="800" y="628" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >1</text><text x="910" y="628" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >hex</text><text x="1120" y="628" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F6DB5" text-anchor="start" >B: yes</text><text x="1410" y="628" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >template</text><text x="1410" y="650" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >binding</text><rect x="48" y="666" width="1504" height="110" rx="0" fill="#F6F8FA" stroke="none" stroke-width="1"/><text x="60" y="694" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#1F2937" text-anchor="start" >Q13</text><text x="170" y="694" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >NestJS: may an application service import a repository</text><text x="170" y="716" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >(RDQ-2)?</text><text x="690" y="694" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >3</text><text x="800" y="694" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >1</text><text x="910" y="694" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >nestjs</text><text x="1120" y="694" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#2F6DB5" text-anchor="start" >B: yes; FF-P04 follows it</text><text x="1410" y="694" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >FF-P04</text><text x="1410" y="716" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >(advisory);</text><text x="1410" y="738" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >fix ADR-V13-02</text><text x="1410" y="760" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#1F2937" text-anchor="start" >text</text><line x1="48" y1="776" x2="1552" y2="776" stroke="#1F2937" stroke-width="1.5"/><text x="48" y="806" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" >&quot;Sheet rows&quot;: rows of the 40-row adjudication sheet the question decides. &quot;Other rows&quot;: rows both manifests agree on today that the option puts at stake.</text><text x="48" y="829" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" >Recommended options are proposals: the author decides each one on its construct (literature first), not on the scores, and records it in an ADR before the hold-out</text><text x="48" y="852" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#5B6472" text-anchor="start" >freeze. Q8 + Q14 is one policy, so its rows are summed (Q8: 0 + 3; Q14: 1 + 1).</text>
