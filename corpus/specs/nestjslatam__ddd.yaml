spec_version: "1.0.0"

architecture:
  style: clean-architecture

  layers:
    - name: domain
      directories:
        - src/domain/**
        - "**/domain/**"
        - "**/entities/**"
        - "**/value-objects/**"
        - "**/valueobjects/**"
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface
      file_patterns:
        - "**/*.entity.ts"
        - "**/*.vo.ts"

    - name: application
      directories:
        - src/application/**
        - "**/application/**"
        - "**/dtos/**"
        - "**/queries/**"
        - "**/use-cases/**"
      roles:
        - use-case
        - dto
        - application-service
      file_patterns:
        - "**/*.command.ts"
        - "**/*.dto.ts"
        - "**/*.query.ts"
        - "**/*.service.ts"

    - name: infrastructure
      directories:
        - src/infrastructure/**
        - "**/infrastructure/**"
        - "**/presentation/**"
        - "**/repositories/**"
      roles:
        - repository-impl
        - controller
        - middleware
        - orm-entity
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.repository.ts"

