# Architectonic Firewall — NestJS Preset
# Supports both layered-directory and feature-module (co-located) projects.
#
# Layer assignment uses TWO strategies:
#   1. directories — for projects with explicit layer folders (src/domain/, etc.)
#   2. file_patterns — for co-located feature modules where *.controller.ts,
#      *.service.ts, *.repository.ts live in the same folder
#
# file_patterns act as a fallback: if a file matches a directory glob, that
# takes priority. If not, the file name determines the layer. This means both
# project shapes work out of the box.

spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/domain/**
        - src/core/**
        - src/entities/**
        - src/models/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories:
        - src/infrastructure/**
        - src/persistence/**
        - src/adapters/**
        - src/prisma/**
        - src/lib/**
        - src/common/middleware/**
        - src/common/filters/**
        - src/common/pipes/**
      file_patterns:
        - "**/*.repository.ts"
        - "**/*.worker.ts"
        - "**/workers/**"
        - "**/strategies/**"
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories:
        - src/application/**
        - src/use-cases/**
        - src/services/**
      file_patterns:
        - "**/*.service.ts"
        - "**/*.processor.ts"
        - "**/dto/**"
        - "**/*.dto.ts"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: presentation
      directories:
        - src/controllers/**
        - src/gateways/**
        - src/common/guards/**
        - src/common/interceptors/**
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.module.ts"
        - "**/*.guard.ts"
        - "**/*.interceptor.ts"
        - "**/*.gateway.ts"
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

fitness_functions:

  # ── STRUCTURAL ──

  - id: FF-S01
    name: dependency-direction
    dimension: structural
    severity: critical
    route: symbolic
    validated: true

  - id: FF-S02
    name: no-cyclic-deps
    dimension: structural
    severity: critical
    route: symbolic
    validated: true

  - id: FF-S03
    name: no-layer-skip
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    # NestJS *.module.ts files are DI wiring — they import from all layers by design
    exclude_paths:
      - "**/*.module.ts"

  - id: FF-S04
    name: no-domain-outward-dep
    dimension: structural
    severity: major
    route: symbolic
    validated: false

  # ── PATTERN ──

  - id: FF-P01
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: true
    forbidden_imports:
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize

  - id: FF-P02
    name: dependency-inversion
    dimension: pattern
    severity: critical
    route: symbolic
    validated: true
    threshold: 0.85

  - id: FF-P03
    name: repository-pattern
    dimension: pattern
    severity: critical
    route: symbolic
    validated: true

  - id: FF-P04
    name: use-case-isolation
    dimension: pattern
    severity: major
    route: symbolic
    validated: true

  - id: FF-P05
    name: controller-no-entity
    dimension: pattern
    severity: major
    route: symbolic
    validated: false

  # ── COUPLING ──

  - id: FF-C01
    name: domain-stability
    dimension: coupling
    severity: major
    route: symbolic
    validated: true
    threshold: 0.3

  - id: FF-C02
    name: module-fan-out
    dimension: coupling
    severity: major
    route: symbolic
    validated: true
    threshold: 12

  - id: FF-C03
    name: component-instability
    dimension: coupling
    severity: major
    route: symbolic
    validated: true
    threshold: 0.8

  - id: FF-C04
    name: no-orphan-files
    dimension: coupling
    severity: minor
    route: symbolic
    validated: false

  - id: FF-C05
    name: max-fan-in
    dimension: coupling
    severity: minor
    route: symbolic
    validated: false
    threshold: 20

  - id: FF-C06
    name: abstraction-ratio
    dimension: coupling
    severity: advisory
    route: symbolic
    validated: false
    threshold: 0.3

  # ── SOLID ──

  - id: FF-SO01
    name: single-responsibility-proxy
    dimension: solid
    severity: major
    route: symbolic
    validated: true
    max_public_methods: 10
    max_dependencies: 5

  - id: FF-SO02
    name: interface-segregation-proxy
    dimension: solid
    severity: major
    route: symbolic
    validated: true
    max_interface_methods: 5

  - id: FF-SO03
    name: inheritance-depth
    dimension: solid
    severity: minor
    route: symbolic
    validated: false
    max_depth: 3

  # ── CONVENTION ──

  - id: FF-CV01
    name: naming-conventions
    dimension: convention
    severity: minor
    route: symbolic
    validated: true

  - id: FF-CV02
    name: naming-services
    dimension: convention
    severity: minor
    route: symbolic
    validated: false
    pattern: "*Service"

  - id: FF-CV03
    name: naming-repos
    dimension: convention
    severity: minor
    route: symbolic
    validated: false
    pattern: "*Repository|*Repo"

  - id: FF-CV04
    name: naming-controllers
    dimension: convention
    severity: minor
    route: symbolic
    validated: false
    pattern: "*Controller"

  - id: FF-CV05
    name: test-file-pairing
    dimension: convention
    severity: advisory
    route: symbolic
    validated: false

  - id: FF-CV06
    name: no-index-logic
    dimension: convention
    severity: advisory
    route: symbolic
    validated: false

  # ── NEURONAL ──

  - id: FF-N01
    name: srp-semantic
    dimension: solid
    severity: major
    route: hybrid
    validated: false
    semantic_criteria:
      rule: "A class should have exactly one reason to change"
      rubric:
        pass: "Class responsibilities are cohesive and serve a single purpose"
        fail: "Class mixes unrelated concerns (data access + business logic, etc.)"
        evidence_required: "Cite specific methods that indicate mixed responsibilities"

  - id: FF-N02
    name: layering-intent
    dimension: intent
    severity: major
    route: neuronal
    validated: false
    semantic_criteria:
      rule: "Code should respect the documented architectural intent"
      rubric:
        pass: "File is in the correct layer and dependencies respect layer boundaries"
        fail: "File logic or dependencies contradict the architectural layer it lives in"
        evidence_required: "Cite the specific import or logic that violates the intent"

default_exclude_paths:
  - "node_modules/**"
  - "dist/**"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "test/**"
  - "src/generated/**"

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    intent: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
