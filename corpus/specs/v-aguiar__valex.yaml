# Style: layered (rule row 3: no @nestjs/core; clean markers in no group); corpus.json style layered.
# Group D: segments [], suffixes [].
# Group A: segments [services], suffixes [].
# Group I: segments [repositories], suffixes [].
# Group P: segments [controllers, middlewares, routes], suffixes [].
# Files per layer: persistence 7, business 3, presentation 9, unmapped 13.
# Architectonic Firewall — Layered Architecture Preset (FR-20, U1 K15)
# Closed (strict) layering after Buschmann et al. (1996): presentation -> business -> persistence.
# Layers are listed bottom-up (index 0 = persistence), so dependency-direction flags an import from a
# lower layer into a higher one and no-layer-skip allows only the adjacent step down
# (business>persistence, presentation>business).
# Every function of the full catalogue is declared (BR-U1-17); applicability disables the
# Clean-Architecture-only templates by style and the application-layer templates by kind, and
# `validate` prints them. FR-07 values and thresholds equal presets/clean-architecture.yaml
# (BR-U1-01, ADR-016 d); the values of the disabled functions are inert.

spec_version: "1.0.0"

architecture:
  style: layered

  layers:
    - name: persistence
      kind: infrastructure
      directories:
        - src/persistence/**
        - "**/repositories/**"
      roles:
        - repository
        - data-access-object
        - orm-entity

    - name: business
      kind: domain
      directories:
        - src/business/**
        - "**/services/**"
        - "**/domain/**"
      file_patterns:
        - "**/*.entity.ts"
      roles:
        - business-service
        - entity
        - value-object

    - name: presentation
      kind: presentation
      directories:
        - src/presentation/**
        - "**/controllers/**"
        - "**/middlewares/**"
        - "**/routes/**"
      roles:
        - controller
        - view
        - presenter

