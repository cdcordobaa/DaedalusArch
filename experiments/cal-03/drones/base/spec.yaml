# CAL-03 drone survey bureau domain: evaluator spec in the p1-transfers format (base tree and all cases).

spec_version: "1.0.0"

architecture:
  style: ddd

  layers:
    - name: domain
      kind: domain
      directories:
        - src/*/domain/**
        - src/shared-kernel/**
      roles:
        - aggregate
        - entity
        - value-object
        - domain-event
        - repository-interface

    - name: application
      kind: application
      directories:
        - src/*/application/**
      roles:
        - application-service
        - port

    - name: infrastructure
      kind: infrastructure
      directories:
        - src/*/infrastructure/**
        - src/*/acl/**
      roles:
        - repository
        - anti-corruption-layer

    - name: api
      kind: presentation
      directories:
        - src/*/api/**
      roles:
        - controller

    # Composition root, outside every context. kind application is only a placeholder for the kind resolver.
    - name: composition
      kind: application
      directories:
        - src/main.ts
      roles:
        - composition-root

  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]

  ddd:
    source_root: src/
    contexts:
      - name: surveys
        root: src/surveys/
        public_api: [src/surveys/index.ts, src/surveys/contracts/**]
        acl: []
      - name: pilots
        root: src/pilots/
        public_api: [src/pilots/index.ts, src/pilots/contracts/**]
        acl: []
      - name: permits
        root: src/permits/
        public_api: [src/permits/index.ts, src/permits/contracts/**]
        acl: []
    outside_contexts: [src/shared-kernel/**, src/main.ts]
    aggregates:
      - name: SurveyJob
        context: surveys
        module: src/surveys/domain/survey/**
        root: src/surveys/domain/survey/SurveyJob.ts
        inner_entities: []
      - name: Pilot
        context: pilots
        module: src/pilots/domain/pilot/**
        root: src/pilots/domain/pilot/Pilot.ts
        inner_entities: []
      - name: Drone
        context: pilots
        module: src/pilots/domain/drone/**
        root: src/pilots/domain/drone/Drone.ts
        inner_entities: []
      - name: FlightPermit
        context: permits
        module: src/permits/domain/permit/**
        root: src/permits/domain/permit/FlightPermit.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]
    invariants:
      - { id: pilot-weekly-hours-cap, kind: set, owner: Pilot, over: [SurveyJob], terms: [weeklyHourCap, assignedHours, surveyId], statement: "the hours assigned to a pilot never exceed the pilot's weekly hour cap" }
      - { id: survey-has-deliverables, kind: single, owner: SurveyJob, over: [SurveyJob], terms: [deliverables, deliverable], statement: "a survey always has at least one deliverable" }
      - { id: permit-reference-unique, kind: uniqueness, over: [FlightPermit], terms: [reference], enforced_by: store }

fitness_functions:

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
