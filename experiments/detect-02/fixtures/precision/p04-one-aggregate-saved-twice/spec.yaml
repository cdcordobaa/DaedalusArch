# DETECT-02 precision fixture: one aggregate saved twice
# DDD spec in the shape of presets/ddd.yaml (layers and the architecture.ddd block); rules are not needed here.
spec_version: "1.0.0"
architecture:
  style: ddd
  layers:
    - { name: domain, kind: domain, directories: ["src/*/domain/**", "src/shared-kernel/**"] }
    - { name: application, kind: application, directories: ["src/*/application/**"] }
    - { name: infrastructure, kind: infrastructure, directories: ["src/*/infrastructure/**", "src/*/acl/**", "src/types/**"] }
    - { name: api, kind: presentation, directories: ["src/*/api/**"] }
    - { name: composition, kind: application, directories: ["src/main.ts"], roles: [composition-root] }
  ddd:
    source_root: src/
    contexts:
      - { name: sales, root: src/sales/, public_api: [src/sales/index.ts, "src/sales/contracts/**"], acl: ["src/sales/acl/**"] }
    outside_contexts: ["src/shared-kernel/**", src/main.ts]
    aggregates:
      - { name: Order, context: sales, module: "src/sales/domain/order/**", root: src/sales/domain/order/Order.ts, inner_entities: [] }
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
