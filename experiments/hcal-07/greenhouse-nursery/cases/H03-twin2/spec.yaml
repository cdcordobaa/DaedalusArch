# HCAL-07 greenhouse-nursery: evaluator spec for the hexagonal calibration set.
spec_version: "1.0.0"

architecture:
  style: hexagonal

  layers:
    - name: domain
      kind: domain
      directories:
        - src/domain/**
      roles:
        - entity
        - value-object
        - domain-service

    - name: application
      kind: application
      directories:
        - src/application/**
      roles:
        - use-case
        - port
        - application-service

    - name: adapters-inbound
      kind: presentation
      directories:
        - src/adapters/in/**
      roles:
        - controller
        - message-consumer

    - name: adapters-outbound
      kind: infrastructure
      directories:
        - src/adapters/out/**
      roles:
        - repository
        - gateway
        - external-api-client
        - notification-sender

    # Composition root: wires adapters to ports.
    - name: config
      kind: application
      directories:
        - src/main.ts
      roles:
        - composition-root

  allowed_dependencies:
    - from: application
      to: [domain]
    - from: adapters-inbound
      to: [application, domain]
    - from: adapters-outbound
      to: [application, domain]
    - from: config
      to: [domain, application, adapters-inbound, adapters-outbound]

fitness_functions:
  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false

  - id: FF-S02
    name: no-cyclic-deps
    dimension: structural
    severity: critical
    route: symbolic
    validated: true

  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false

  - id: FF-S04
    name: core-isolation
    dimension: structural
    severity: major
    route: symbolic
    validated: false

  - id: FF-P01
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: true
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - knex
      - palletpath-sdk

  - id: FF-P02
    name: port-dependency-inversion
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    threshold: 0.85

  - id: FF-P03
    name: port-adapter-pattern
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false

  - id: FF-P06
    name: domain-state-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false

  - id: FF-C02
    name: module-fan-out
    dimension: coupling
    severity: major
    route: symbolic
    validated: true
    threshold: 10

  - id: FF-C03
    name: component-instability
    dimension: coupling
    severity: major
    route: symbolic
    validated: true

  - id: FF-C04
    name: no-orphan-files
    dimension: coupling
    severity: minor
    route: symbolic
    validated: false

  - id: FF-C05
    name: max-fan-in
    dimension: coupling
    severity: minor
    route: symbolic
    validated: false
    threshold: 15

  - id: FF-C06
    name: abstraction-ratio
    dimension: coupling
    severity: advisory
    route: symbolic
    validated: false
    threshold: 0.3

  - id: FF-SO01
    name: single-responsibility-proxy
    dimension: solid
    severity: major
    route: symbolic
    validated: true
    max_public_methods: 10
    max_dependencies: 5

  - id: FF-SO02
    name: interface-segregation-proxy
    dimension: solid
    severity: major
    route: symbolic
    validated: true
    max_interface_methods: 5

  - id: FF-SO03
    name: inheritance-depth
    dimension: solid
    severity: minor
    route: symbolic
    validated: false
    max_depth: 3

  - id: FF-CV02
    name: naming-services
    dimension: convention
    severity: minor
    route: symbolic
    validated: false
    pattern: "*Service|*UseCase"

  - id: FF-CV03
    name: naming-repos
    dimension: convention
    severity: minor
    route: symbolic
    validated: false
    pattern: "*Repository|*Repo"

  - id: FF-CV05
    name: test-file-pairing
    dimension: convention
    severity: advisory
    route: symbolic
    validated: false

  - id: FF-CV06
    name: no-index-logic
    dimension: convention
    severity: advisory
    route: symbolic
    validated: false

  - id: FF-N01
    name: architectural-integrity
    dimension: integrity
    severity: major
    route: neuronal
    validated: false
    semantic_criteria:
      rule: "The module's files form one coherent unit with a consistent abstraction and boundary."
      rubric:
        pass: "The files serve one cohesive concern, use the module's abstractions consistently, and keep each rule or invariant in one place."
        fail: "The files split into unrelated concerns, duplicate a rule or invariant that should live in one place, or bypass the module's own abstractions."
        evidence_required: "Name each file involved and cite the declarations that show the split, the duplication or the bypass."

  - id: FF-N02
    name: intent-alignment
    dimension: semantic
    severity: major
    route: neuronal
    validated: false
    semantic_criteria:
      rule: "The unit's responsibilities match the role of its declared layer."
      rubric:
        pass: "Every responsibility in the file belongs to the role and kind of its declared layer, and agrees with any ADR prose given."
        fail: "The file carries a responsibility that belongs to a different layer kind, for example persistence, transport or framework logic in a domain file, or business rules in an infrastructure or presentation file."
        evidence_required: "Name the file and cite the function, method or statement that carries the misplaced responsibility, and the layer kind it belongs to."

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70

# Domain glossary: the terms the nursery owns. Anything not listed here is not domain vocabulary.
glossary:
  - term: dispatch order
    owner: domain
    definition: "A garden centre's order of plant trays, sent from the nursery by pallet freight."
  - term: dispatch status
    owner: domain
    values: [ORDERED, BOOKED, SHIPPED, RECEIVED, HELD]
    definition: "Where a dispatch order stands in the nursery's own dispatch life cycle."
  - term: tray
    owner: domain
    definition: "A tray of potted plants; forty trays fit on one pallet."
  - term: freight refusal
    owner: domain
    values: [too-heavy, area-not-served, plants-restricted, no-slot]
    definition: "Why freight could not be booked, in the words the nursery uses with garden centres."
  - term: delivery outcome
    owner: domain
    values: [in-transit, received, returned]
    definition: "What the nursery needs to know about a load on its way: still travelling, received by the garden centre, or coming back."

