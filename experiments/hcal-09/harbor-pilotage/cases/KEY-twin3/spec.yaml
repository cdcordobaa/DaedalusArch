# HCAL-09 harbor-pilotage: evaluator spec for the hexagonal calibration set.
spec_version: "1.0.0"

architecture:
  style: hexagonal

  layers:
    - name: domain
      kind: domain
      directories:
        - src/domain/**
      roles:
        - entity
        - value-object
        - domain-service

    - name: application
      kind: application
      directories:
        - src/application/**
      roles:
        - use-case
        - port
        - application-service

    - name: adapters-inbound
      kind: presentation
      directories:
        - src/adapters/in/**
      roles:
        - controller
        - message-consumer

    - name: adapters-outbound
      kind: infrastructure
      directories:
        - src/adapters/out/**
      roles:
        - repository
        - gateway
        - external-api-client
        - notification-sender

    # Composition root: wires adapters to ports.
    - name: config
      kind: application
      directories:
        - src/main.ts
      roles:
        - composition-root

  allowed_dependencies:
    - from: application
      to: [domain]
    - from: adapters-inbound
      to: [application, domain]
    - from: adapters-outbound
      to: [application, domain]
    - from: config
      to: [domain, application, adapters-inbound, adapters-outbound]

fitness_functions:
  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false

  - id: FF-S02
    name: no-cyclic-deps
    dimension: structural
    severity: critical
    route: symbolic
    validated: true

  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false

  - id: FF-S04
    name: core-isolation
    dimension: structural
    severity: major
    route: symbolic
    validated: false

  - id: FF-P01
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: true
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - knex
      - tidewatch-sdk

  - id: FF-P02
    name: port-dependency-inversion
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    threshold: 0.85

  - id: FF-P03
    name: port-adapter-pattern
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false

  - id: FF-P06
    name: domain-state-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false

  - id: FF-C02
    name: module-fan-out
    dimension: coupling
    severity: major
    route: symbolic
    validated: true
    threshold: 10

  - id: FF-C03
    name: component-instability
    dimension: coupling
    severity: major
    route: symbolic
    validated: true

  - id: FF-C04
    name: no-orphan-files
    dimension: coupling
    severity: minor
    route: symbolic
    validated: false

  - id: FF-C05
    name: max-fan-in
    dimension: coupling
    severity: minor
    route: symbolic
    validated: false
    threshold: 15

  - id: FF-C06
    name: abstraction-ratio
    dimension: coupling
    severity: advisory
    route: symbolic
    validated: false
    threshold: 0.3

  - id: FF-SO01
    name: single-responsibility-proxy
    dimension: solid
    severity: major
    route: symbolic
    validated: true
    max_public_methods: 10
    max_dependencies: 5

  - id: FF-SO02
    name: interface-segregation-proxy
    dimension: solid
    severity: major
    route: symbolic
    validated: true
    max_interface_methods: 5

  - id: FF-SO03
    name: inheritance-depth
    dimension: solid
    severity: minor
    route: symbolic
    validated: false
    max_depth: 3

  - id: FF-CV02
    name: naming-services
    dimension: convention
    severity: minor
    route: symbolic
    validated: false
    pattern: "*Service|*UseCase"

  - id: FF-CV03
    name: naming-repos
    dimension: convention
    severity: minor
    route: symbolic
    validated: false
    pattern: "*Repository|*Repo"

  - id: FF-CV05
    name: test-file-pairing
    dimension: convention
    severity: advisory
    route: symbolic
    validated: false

  - id: FF-CV06
    name: no-index-logic
    dimension: convention
    severity: advisory
    route: symbolic
    validated: false

  - id: FF-N01
    name: architectural-integrity
    dimension: integrity
    severity: major
    route: neuronal
    validated: false
    semantic_criteria:
      rule: "The module's files form one coherent unit with a consistent abstraction and boundary."
      rubric:
        pass: "The files serve one cohesive concern, use the module's abstractions consistently, and keep each rule or invariant in one place."
        fail: "The files split into unrelated concerns, duplicate a rule or invariant that should live in one place, or bypass the module's own abstractions."
        evidence_required: "Name each file involved and cite the declarations that show the split, the duplication or the bypass."

  - id: FF-N02
    name: intent-alignment
    dimension: semantic
    severity: major
    route: neuronal
    validated: false
    semantic_criteria:
      rule: "The unit's responsibilities match the role of its declared layer."
      rubric:
        pass: "Every responsibility in the file belongs to the role and kind of its declared layer, and agrees with any ADR prose given."
        fail: "The file carries a responsibility that belongs to a different layer kind, for example persistence, transport or framework logic in a domain file, or business rules in an infrastructure or presentation file."
        evidence_required: "Name the file and cite the function, method or statement that carries the misplaced responsibility, and the layer kind it belongs to."

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70

# Domain glossary: the terms the pilotage service owns. Anything not listed here is not domain vocabulary.
glossary:
  - term: pilotage job
    owner: domain
    definition: "One vessel movement for which the harbour assigns a marine pilot."
  - term: job status
    owner: domain
    values: [REQUESTED, SCHEDULED, BOARDED, COMPLETED, CANCELLED]
    definition: "Where a pilotage job stands in the service's own life cycle, as shown to the ship's agent."
  - term: vessel stage
    owner: domain
    values: [approaching, alongside, departed, abandoned]
    definition: "The service's own reading of where the vessel is relative to its berth."
  - term: tide slot
    owner: domain
    definition: "The window in which the vessel may cross the bar, with the water left under its keel."
  - term: clearance
    owner: domain
    values: [ample, tight, none]
    definition: "The harbour master's reading of the under-keel margin; a tight slot needs a second pilot."
  - term: pilotage fee
    owner: domain
    definition: "The harbour tariff for one job: a base fee, a draught surcharge and a night surcharge."
  - term: hull class
    owner: domain
    values: [PANAMAX, HANDYSIZE, FEEDER, COASTER]
    definition: "The harbour master's tariff classes by hull size, set in the harbour by-laws; the tide service uses the same names."

