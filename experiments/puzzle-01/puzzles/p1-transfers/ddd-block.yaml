  ddd:
    source_root: src/
    contexts:
      - name: ledger
        root: src/ledger/
        public_api: [src/ledger/index.ts, src/ledger/contracts/**]
        acl: []
    outside_contexts: [src/shared-kernel/**, src/main.ts]
    aggregates:
      - name: Account
        context: ledger
        module: src/ledger/domain/account/**
        root: src/ledger/domain/account/Account.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]
