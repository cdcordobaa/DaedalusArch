  ddd:
    source_root: src/
    contexts:
      - name: membership
        root: src/membership/
        public_api: [src/membership/index.ts, src/membership/contracts/**]
        acl: []
      - name: sales
        root: src/sales/
        public_api: [src/sales/index.ts, src/sales/contracts/**]
        acl: [src/sales/acl/**]
    outside_contexts: [src/shared-kernel/**, src/main.ts]
    aggregates:
      - name: Member
        context: membership
        module: src/membership/domain/member/**
        root: src/membership/domain/member/Member.ts
        inner_entities: []
      - name: Order
        context: sales
        module: src/sales/domain/order/**
        root: src/sales/domain/order/Order.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]
