# REPO-SCOUT spec for novu @ 894d63ff (hand-written from the repository's own structure: one NestJS feature module
# per folder under apps/api/src/app/ (each declares an @Module), use cases under usecases/, persistence in
# libs/dal (one repository and entity per collection), shared use cases and services in libs/application-generic).
# Roles for the DETECT-02 comprehension tools only.
architecture:
  style: ddd
  layers:
    - name: api
      kind: infrastructure
      directories: ['apps/api/src/app/*/*.controller.ts', 'apps/api/src/app/*/dtos/**', 'apps/api/src/app/*/e2e/**']
    - name: usecases
      kind: application
      directories: ['apps/api/src/app/*/usecases/**', 'libs/application-generic/src/usecases/**']
    - name: services
      kind: application
      directories: ['apps/api/src/app/*/services/**', 'libs/application-generic/src/services/**']
    - name: entities
      kind: domain
      directories: ['libs/dal/src/repositories/**/*.entity.ts']
    - name: dal
      kind: infrastructure
      directories: ['libs/dal/src/**']
  ddd:
    repositories: ['libs/dal/src/repositories/**/*.repository.ts']
    contexts:
      - name: activity
        root: apps/api/src/app/activity/
      - name: agents
        root: apps/api/src/app/agents/
      - name: analytics
        root: apps/api/src/app/analytics/
