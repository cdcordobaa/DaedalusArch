  ddd:
    source_root: src/
    contexts:
      - name: enrolment
        root: src/enrolment/
        public_api: [src/enrolment/index.ts, src/enrolment/contracts/**]
        acl: []
    outside_contexts: [src/shared-kernel/**, src/main.ts]
    aggregates:
      - name: Section
        context: enrolment
        module: src/enrolment/domain/section/**
        root: src/enrolment/domain/section/Section.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]
