  ddd:
    source_root: src/
    contexts:
      - name: berthing
        root: src/berthing/
        public_api: [src/berthing/index.ts, src/berthing/contracts/**]
        acl: [src/berthing/acl/**]
      - name: membership
        root: src/membership/
        public_api: [src/membership/index.ts, src/membership/contracts/**]
        acl: [src/membership/acl/**]
    outside_contexts: [src/shared-kernel/**, src/bus/**, src/main.ts]
    aggregates:
      - name: Pontoon
        context: berthing
        module: src/berthing/domain/pontoon/**
        root: src/berthing/domain/pontoon/Pontoon.ts
        inner_entities: []
      - name: Membership
        context: membership
        module: src/membership/domain/membership/**
        root: src/membership/domain/membership/Membership.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]
