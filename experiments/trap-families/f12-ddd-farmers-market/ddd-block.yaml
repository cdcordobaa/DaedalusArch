  ddd:
    source_root: src/
    contexts:
      - name: licensing
        root: src/licensing/
        public_api: [src/licensing/index.ts, src/licensing/published/**]
        acl: []
      - name: market
        root: src/market/
        public_api: [src/market/index.ts, src/market/published/**]
        acl: [src/market/acl/**]
    outside_contexts: [src/shared-kernel/**, src/main.ts]
    aggregates:
      - name: Vendor
        context: licensing
        module: src/licensing/domain/vendor/**
        root: src/licensing/domain/vendor/Vendor.ts
        inner_entities: []
      - name: MarketDay
        context: market
        module: src/market/domain/day/**
        root: src/market/domain/day/MarketDay.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Store.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]
