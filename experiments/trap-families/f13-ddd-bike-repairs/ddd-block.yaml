  ddd:
    source_root: src/
    contexts:
      - name: workshop
        root: src/workshop/
        public_api: [src/workshop/index.ts, src/workshop/contracts/**]
        acl: []
    outside_contexts: [src/shared-kernel/**, src/main.ts]
    aggregates:
      - name: RepairJob
        context: workshop
        module: src/workshop/domain/job/**
        root: src/workshop/domain/job/RepairJob.ts
        inner_entities: []
      - name: Stockroom
        context: workshop
        module: src/workshop/domain/stock/**
        root: src/workshop/domain/stock/Stockroom.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]
