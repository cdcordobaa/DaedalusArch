  ddd:
    source_root: src/
    contexts:
      - name: passes
        root: src/passes/
        public_api: [src/passes/index.ts, src/passes/contracts.ts]
        acl: []
      - name: school
        root: src/school/
        public_api: [src/school/index.ts, src/school/contracts.ts]
        acl: []
    outside_contexts: [src/shared-kernel/**, src/wiring/**, src/main.ts]
    aggregates:
      - name: SkiPass
        context: passes
        module: src/passes/domain/**
        root: src/passes/domain/SkiPass.ts
        inner_entities: []
      - name: Lesson
        context: school
        module: src/school/domain/**
        root: src/school/domain/Lesson.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/*Book.ts", "src/*/infrastructure/*Store.ts"]
    domain_event_types: [Happening]
    application_services: ["src/*/application/*.ts"]
