  ddd:
    source_root: src/
    contexts:
      - name: carparks
        root: src/carparks/
        public_api: [src/carparks/index.ts, src/carparks/contracts/**]
        acl: []
      - name: reservations
        root: src/reservations/
        public_api: [src/reservations/index.ts, src/reservations/contracts/**]
        acl: [src/reservations/acl/**]
    outside_contexts: [src/shared-kernel/**, src/messaging/**, src/main.ts]
    aggregates:
      - name: CarPark
        context: carparks
        module: src/carparks/domain/carpark/**
        root: src/carparks/domain/carpark/CarPark.ts
        inner_entities: []
      - name: Reservation
        context: reservations
        module: src/reservations/domain/reservation/**
        root: src/reservations/domain/reservation/Reservation.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]
