  ddd:
    source_root: src/
    contexts:
      - name: shifts
        root: src/shifts/
        public_api: [src/shifts/index.ts, src/shifts/contracts/**]
        acl: []
      - name: signups
        root: src/signups/
        public_api: [src/signups/index.ts, src/signups/contracts/**]
        acl: [src/signups/acl/**]
    outside_contexts: [src/shared-kernel/**, src/messaging/**, src/main.ts]
    aggregates:
      - name: Shift
        context: shifts
        module: src/shifts/domain/shift/**
        root: src/shifts/domain/shift/Shift.ts
        inner_entities: []
      - name: SignUp
        context: signups
        module: src/signups/domain/signup/**
        root: src/signups/domain/signup/SignUp.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]
