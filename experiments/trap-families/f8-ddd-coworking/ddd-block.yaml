  ddd:
    source_root: src/
    contexts:
      - name: spaces
        root: src/spaces/
        public_api: [src/spaces/index.ts, src/spaces/contracts/**]
        acl: []
    outside_contexts: [src/shared-kernel/**, src/main.ts]
    aggregates:
      - name: Room
        context: spaces
        module: src/spaces/domain/room/**
        root: src/spaces/domain/room/Room.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]
