# v1.3 operators-hexddd real-project spec (development data). Architecture block: arch/bitloops-ddd.yaml.
# Functions and scoring: verbatim from presets/ddd.yaml. Generated by build-specs.mjs; do not edit.

spec_version: "1.0.0"

architecture:
  style: ddd
  layers:
    - name: composition
      kind: application
      directories: [src/main.ts, src/app.module.ts, "src/config/**", "src/bounded-contexts/*/*/*.module.ts", "src/lib/bounded-contexts/*/*/*.module.ts"]
      roles: [composition-root]
    - name: api
      kind: presentation
      directories: ["src/api/**"]
      roles: [controller]
    - name: application
      kind: application
      directories: ["src/lib/bounded-contexts/*/*/application/**", "src/lib/bounded-contexts/*/*/commands/**", "src/lib/bounded-contexts/*/*/queries/**", "src/lib/bounded-contexts/*/*/ports/**", "src/lib/bounded-contexts/*/*/dtos/**"]
      roles: [application-service, port]
    - name: domain
      kind: domain
      directories: ["src/lib/bounded-contexts/*/*/domain/**", "src/lib/bounded-contexts/*/*/structs/**", "src/lib/bounded-contexts/*/*/constants.ts"]
      roles: [aggregate, entity, value-object, domain-event]
    - name: infrastructure
      kind: infrastructure
      directories: ["src/bounded-contexts/**", "src/lib/infra/**"]
      roles: [repository]
  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]
  ddd:
    source_root: src/lib/bounded-contexts/
    contexts:
      - name: iam
        root: src/lib/bounded-contexts/iam/
        public_api: ["src/lib/bounded-contexts/iam/*/contracts/**", "src/lib/bounded-contexts/iam/*/*.module.ts"]
        acl: []
      - name: marketing
        root: src/lib/bounded-contexts/marketing/
        public_api: ["src/lib/bounded-contexts/marketing/*/contracts/**", "src/lib/bounded-contexts/marketing/*/*.module.ts"]
        acl: []
      - name: todo
        root: src/lib/bounded-contexts/todo/
        public_api: ["src/lib/bounded-contexts/todo/*/contracts/**", "src/lib/bounded-contexts/todo/*/*.module.ts"]
        acl: []
    outside_contexts: []
    aggregates:
      - name: Todo
        context: todo
        module: src/lib/bounded-contexts/todo/todo/domain/todo.entity.ts
        root: src/lib/bounded-contexts/todo/todo/domain/todo.entity.ts
        inner_entities: []
      - name: User
        context: marketing
        module: src/lib/bounded-contexts/marketing/marketing/domain/user.entity.ts
        root: src/lib/bounded-contexts/marketing/marketing/domain/user.entity.ts
        inner_entities: []
      - name: NotificationTemplate
        context: marketing
        module: src/lib/bounded-contexts/marketing/marketing/domain/notification-template.entity.ts
        root: src/lib/bounded-contexts/marketing/marketing/domain/notification-template.entity.ts
        inner_entities: []
    value_objects: ["src/lib/bounded-contexts/*/*/domain/*.value-object.ts"]
    repositories: ["src/bounded-contexts/*/*/repository/*.repository.ts", "src/lib/bounded-contexts/*/*/ports/*.repo-port.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/lib/bounded-contexts/*/*/application/**/*.ts"]

fitness_functions:

  # ── STRATEGIC ──

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # ── TACTICAL ──

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Blocking per the sealed Docs/v1.3/rule-tiers.md. The check is still a method-name proxy (the extractor sees no
  # readonly, accessors or visibility); see Docs/v1.3-ddd-notes.md §2 for the proposed ADR.
  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Framework-free domain: the existing domain-purity template, unchanged, with the DDD package list.
  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (placement guideline).
  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # Advisory heuristic: more methods than the threshold in an application service.
  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  # ── LAYERING INSIDE EACH CONTEXT (hexagonal templates) ──

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (hexagonal does not define strict layering).
  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
