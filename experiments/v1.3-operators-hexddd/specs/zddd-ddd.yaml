# v1.3 operators-hexddd real-project spec (development data). Architecture block: arch/zddd-ddd.yaml.
# Functions and scoring: verbatim from presets/ddd.yaml. Generated by build-specs.mjs; do not edit.

spec_version: "1.0.0"

architecture:
  style: ddd
  layers:
    - name: composition
      kind: application
      directories: [src/main.ts, src/app.module.ts, src/config.ts, "src/**/*.module.ts"]
      roles: [composition-root]
    - name: application
      kind: application
      directories: ["src/**/domain/interactors/**"]
      roles: [application-service]
    - name: domain
      kind: domain
      directories: ["src/**/domain/**", "src/__lib__/**"]
      roles: [aggregate, entity, value-object, domain-event]
    - name: api
      kind: presentation
      directories: ["src/**/controllers/**"]
      roles: [controller]
    - name: infrastructure
      kind: infrastructure
      directories: ["src/**/dal/**", "src/**/api/**"]
      roles: [repository, anti-corruption-layer]
  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]
  ddd:
    source_root: src/
    contexts:
      - name: accounting
        root: src/accounting/
        public_api: ["src/accounting/**/*.module.ts", "src/accounting/**/domain/ports/in/**"]
        acl: ["src/accounting/**/api/**"]
      - name: cart
        root: src/cart/
        public_api: ["src/cart/**/*.module.ts", "src/cart/**/domain/ports/in/**"]
        acl: ["src/cart/**/api/**"]
      - name: delivery
        root: src/delivery/
        public_api: ["src/delivery/**/*.module.ts", "src/delivery/**/domain/ports/in/**"]
        acl: ["src/delivery/**/api/**"]
      - name: warehouse
        root: src/warehouse/
        public_api: ["src/warehouse/**/*.module.ts", "src/warehouse/**/domain/ports/in/**"]
        acl: ["src/warehouse/**/api/**"]
    outside_contexts: ["src/__infrastructure__/**", "src/__lib__/**", "src/__relay__/**", "src/__saga__/**", src/main.ts, src/app.module.ts, src/config.ts]
    aggregates:
      - name: Report
        context: accounting
        module: "src/accounting/reports/report/domain/entities/**"
        root: src/accounting/reports/report/domain/entities/report.entity.ts
        inner_entities: [src/accounting/reports/report/domain/entities/report-position.entity.ts]
      - name: Cart
        context: cart
        module: "src/cart/cart/domain/entities/**"
        root: src/cart/cart/domain/entities/cart.entity.ts
        inner_entities: [src/cart/cart/domain/entities/cart-position.entity.ts]
      - name: Offer
        context: delivery
        module: "src/delivery/board/offer/domain/entities/**"
        root: src/delivery/board/offer/domain/entities/offer.entity.ts
        inner_entities: []
      - name: Curier
        context: delivery
        module: "src/delivery/curiers/curier/domain/entities/**"
        root: src/delivery/curiers/curier/domain/entities/curier.entity.ts
        inner_entities: [src/delivery/curiers/curier/domain/entities/order.entity.ts]
      - name: Warehouse
        context: warehouse
        module: "src/warehouse/order-management/warehouse/domain/entities/**"
        root: src/warehouse/order-management/warehouse/domain/entities/warehouse.entity.ts
        inner_entities: [src/warehouse/order-management/warehouse/domain/entities/order.entity.ts]
    value_objects: ["src/**/domain/object-values/**"]
    repositories: ["src/**/dal/*.repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/**/domain/interactors/*.ts"]

fitness_functions:

  # ── STRATEGIC ──

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # ── TACTICAL ──

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Blocking per the sealed Docs/v1.3/rule-tiers.md. The check is still a method-name proxy (the extractor sees no
  # readonly, accessors or visibility); see Docs/v1.3-ddd-notes.md §2 for the proposed ADR.
  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Framework-free domain: the existing domain-purity template, unchanged, with the DDD package list.
  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (placement guideline).
  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # Advisory heuristic: more methods than the threshold in an application service.
  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  # ── LAYERING INSIDE EACH CONTEXT (hexagonal templates) ──

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (hexagonal does not define strict layering).
  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

scoring:
