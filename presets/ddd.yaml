# Architectonic Firewall — Domain-Driven Design Preset (v1.3, FR-V4)
# Rule definitions, literature sources (Evans 2003, Vernon 2013) and tier reasons: Docs/v1.3-ddd-notes.md.
#
# The extractor cannot tell which directory is a bounded context or which file is an aggregate root, so those facts
# are declared in `architecture.ddd` (read by the ddd style only). The declarations below describe the DDD reference
# project (tests/fixtures/v1.3-reference/ddd): replace them with your own contexts and aggregates. The layer globs and
# role globs are conventions (src/<context>/{domain,application,infrastructure,acl,api}/...) and usually carry over.
#
# Two kinds of rule:
#   - DDD rules (FF-DS.., FF-DT..), templates outside the frozen CYPHER_TEMPLATES (src/fitness-compiler/ddd-templates.ts);
#   - the hexagonal graph layering composed inside each context (FF-S01, FF-S03; allowed_dependencies below).
# Every function carries `tier` (ddd style only), assigned before any precision was measured. Scoring does not read it
# yet (FR-V6). FR-07 values: FF-DT04 extends the layered forbidden list; FF-DT06 threshold 3 (a priori, notes §1).

spec_version: "1.0.0"

architecture:
  style: ddd

  layers:
    - name: domain
      kind: domain
      directories:
        - src/*/domain/**
        - src/shared-kernel/**
      roles:
        - aggregate
        - entity
        - value-object
        - domain-event
        - repository-interface

    - name: application
      kind: application
      directories:
        - src/*/application/**
      roles:
        - application-service
        - port

    - name: infrastructure
      kind: infrastructure
      directories:
        - src/*/infrastructure/**
        - src/*/acl/**
      roles:
        - repository
        - anti-corruption-layer

    - name: api
      kind: presentation
      directories:
        - src/*/api/**
      roles:
        - controller

    # Composition root, outside every context. kind application is only a placeholder for the kind resolver.
    - name: composition
      kind: application
      directories:
        - src/main.ts
      roles:
        - composition-root

  # Layering inside each context (`from` may import each layer in `to`); cross-context imports are FF-DS02's.
  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]

  ddd:
    source_root: src/
    contexts:
      - name: ordering
        root: src/ordering/
        public_api: [src/ordering/index.ts, src/ordering/contracts/**]
        acl: []
      - name: billing
        root: src/billing/
        public_api: [src/billing/index.ts, src/billing/contracts/**]
        acl: [src/billing/acl/**]
    # Paths under source_root that belong to no context: the shared kernel and the composition root.
    outside_contexts: [src/shared-kernel/**, src/main.ts]
    aggregates:
      - name: Order
        context: ordering
        module: src/ordering/domain/order/**
        root: src/ordering/domain/order/Order.ts
        inner_entities: [src/ordering/domain/order/OrderLine.ts]
      - name: Customer
        context: ordering
        module: src/ordering/domain/customer/**
        root: src/ordering/domain/customer/Customer.ts
        inner_entities: []
      - name: Invoice
        context: billing
        module: src/billing/domain/invoice/**
        root: src/billing/domain/invoice/Invoice.ts
        inner_entities: [src/billing/domain/invoice/InvoiceLine.ts]
    value_objects: ["src/**/value-objects/**"]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]

fitness_functions:

  # ── STRATEGIC ──

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # ── TACTICAL ──

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory: a method-name proxy (the extractor sees no readonly, accessors or visibility).
  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # Framework-free domain: the existing domain-purity template, unchanged, with the DDD package list.
  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory heuristic: more methods than the threshold in an application service.
  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  # ── LAYERING INSIDE EACH CONTEXT (hexagonal templates) ──

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
