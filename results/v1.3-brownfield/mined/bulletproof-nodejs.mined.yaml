# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: layered (ISE, confidence 0.67); layers: ISE preset-first
# mined rules: 21 (20 emitted)
# MR-001 [layer-direction, medium 0.64] persistence must not depend on business (6 edges business -> persistence; 0/3 persistence files import business)
# MR-002 [layer-direction, medium 0.68] persistence must not depend on presentation (10 edges presentation -> persistence; 0/3 persistence files import presentation)
# MR-003 [layer-direction, medium 0.67] business must not depend on presentation (4 edges presentation -> business; 0/5 business files import presentation)
# MR-004 [acyclic-files, high 0.96] no file lies on an import cycle (25/25 files do not)
# MR-005 [component-direction, low 0.33] folder component subscribers must not depend on services (1 imports services -> subscribers; 0/2 files import back)
# MR-006 [component-direction, low 0.33] folder component subscribers must not depend on loaders (1 imports loaders -> subscribers; 0/2 files import back)
# MR-007 [component-direction, low 0.25] folder component models must not depend on loaders (1 imports loaders -> models; 0/1 files import back)
# MR-008 [component-direction, low 0.33] folder component services must not depend on api (1 imports api -> services; 0/2 files import back)
# MR-009 [component-direction, low 0.33] folder component services must not depend on jobs (1 imports jobs -> services; 0/2 files import back)
# MR-010 [component-direction, low 0.25] folder component interfaces must not depend on subscribers (1 imports subscribers -> interfaces; 0/1 files import back)
# MR-011 [component-direction, low 0.25] folder component interfaces must not depend on models (1 imports models -> interfaces; 0/1 files import back)
# MR-012 [component-direction, low 0.33] folder component interfaces must not depend on services (2 imports services -> interfaces; 0/1 files import back)
# MR-013 [component-direction, low 0.33] folder component interfaces must not depend on api (2 imports api -> interfaces; 0/1 files import back)
# MR-014 [component-direction, low 0.44] folder component api must not depend on loaders (1 imports loaders -> api; 0/7 files import back)
# MR-015 [component-direction, low 0.25] folder component config must not depend on services (1 imports services -> config; 0/1 files import back)
# MR-016 [component-direction, low 0.43] folder component config must not depend on loaders (6 imports loaders -> config; 0/1 files import back)
# MR-017 [component-direction, low 0.33] folder component config must not depend on api (2 imports api -> config; 0/1 files import back)
# MR-018 [component-direction, low 0.25] folder component decorators must not depend on services (1 imports services -> decorators; 0/1 files import back)
# MR-019 [component-direction, low 0.25] folder component jobs must not depend on loaders (1 imports loaders -> jobs; 0/1 files import back)
# MR-020 [public-api, high 0.91] imports into folder component config go through its entry files (src/config/index.ts): 10/10
# MR-021 [core-package-free, high 0.75] persistence (a core layer: it may depend on no other layer) imports none of @useoptic/express-middleware, agenda, agendash, argon2, celebrate, cors, crypto, express, express-basic-auth, express-jwt, form-data, jsonwebtoken, mailgun.js, method-override, mongodb, mongoose, winston -- not emitted: domain-purity checks the domain-kind layer only (business), not persistence
# note: mined as allowed but forbidden by the layered order: presentation>persistence

spec_version: "1.0.0"

architecture:
  style: layered

  layers:
    - name: persistence
      kind: infrastructure
      directories:
        - src/config/**
        - src/decorators/**
        - src/interfaces/**
      roles:
        - repository
        - data-access-object
        - orm-entity

    - name: business
      kind: domain
      directories:
        - src/models/**
        - src/services/**
        - src/subscribers/**
      roles:
        - business-service
        - entity
        - value-object

    - name: presentation
      kind: presentation
      directories:
        - src/api/**
        - src/jobs/**
        - src/loaders/**
      roles:
        - controller
        - view
        - presenter

