# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: clean-architecture (ISE, confidence 0.40); layers: ISE preset-first
# mined rules: 5 (5 emitted)
# MR-001 [layer-direction, high 0.90] domain must not depend on application (16 edges application -> domain; 0/24 domain files import application)
# MR-002 [acyclic-files, high 0.97] no file lies on an import cycle (36/36 files do not)
# MR-003 [component-direction, low 0.44] folder component helpers must not depend on ports (2 imports ports -> helpers; 0/2 files import back)
# MR-004 [component-direction, high 0.89] folder component core must not depend on ports (14 imports ports -> core; 0/21 files import back)
# MR-005 [core-package-free, high 0.96] domain (a core layer: it may depend on no other layer) imports none of argon2, cors, express, jose, slugify, uuid

spec_version: "1.0.0"

architecture:
  style: clean-architecture

  layers:
    - name: domain
      directories:
        - src/config/**
        - src/core/**
        - src/helpers/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: application
      directories:
        - src/app.ts
        - src/ports/**
      roles:
        - use-case
        - dto
        - application-service

    - name: infrastructure
      directories: []
      roles:
        - repository-impl
        - controller
        - middleware
        - orm-entity

