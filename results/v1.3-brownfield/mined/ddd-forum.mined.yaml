spec_version: "1.0.0"

architecture:
  style: clean-architecture

  layers:
    - name: domain
      directories:
        - src/config/**
        - src/shared/core/**
        - src/shared/domain/**
        - src/shared/utils/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: application
      directories: []
      roles:
        - use-case
        - dto
        - application-service

    - name: infrastructure
      directories:
        - src/modules/forum/**
        - src/modules/users/**
        - src/shared/infra/**
      roles:
        - repository-impl
        - controller
        - middleware
        - orm-entity

