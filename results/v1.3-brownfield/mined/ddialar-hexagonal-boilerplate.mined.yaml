# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: hexagonal (ISE, confidence 0.50); layers: ISE preset-first
# mined rules: 12 (11 emitted)
# MR-001 [layer-direction, medium 0.60] domain must not depend on application (2 edges application -> domain; 0/9 domain files import application)
# MR-002 [layer-direction, low 0.45] domain must not depend on adapters-inbound (1 edges adapters-inbound -> domain; 0/9 domain files import adapters-inbound)
# MR-003 [layer-unobserved, low 0.23] domain must not depend on config (no import between them either way)
# MR-004 [layer-rare-edge, low 0.39] application should not depend on domain (1/8 application files imports it; nothing goes back) -- 2 exception(s): src/adapters/transportLayer/server/server.ts -> src/utils/index.ts, src/adapters/transportLayer/server/server.ts -> src/utils/logger/index.ts
# MR-005 [layer-direction, low 0.44] application must not depend on adapters-inbound (1 edges adapters-inbound -> application; 0/8 application files import adapters-inbound)
# MR-006 [layer-direction, low 0.44] application must not depend on config (1 edges config -> application; 0/8 application files import config)
# MR-007 [layer-direction, low 0.25] adapters-inbound must not depend on config (1 edges config -> adapters-inbound; 0/1 adapters-inbound files import config)
# MR-008 [layer-unobserved, low 0.23] config must not depend on domain (no import between them either way)
# MR-009 [acyclic-files, high 0.95] no file lies on an import cycle (19/19 files do not)
# MR-010 [component-direction, low 0.33] folder component utils must not depend on adapters (1 imports adapters -> utils; 0/2 files import back)
# MR-011 [core-package-free, high 0.90] domain (a core layer: it may depend on no other layer) imports none of body-parser, express, http, swagger-ui-express
# MR-012 [core-package-free, high 0.89] application (a core layer: it may depend on no other layer) imports none of bunyan -- not emitted: domain-purity checks the domain-kind layer only (domain), not application

spec_version: "1.0.0"

architecture:
  style: hexagonal

  layers:
    - name: domain
      kind: domain
      directories:
        - src/adapters/dataSources/**
        - src/core/**
        - src/ports/**
        - src/utils/**
      roles:
        - entity
        - value-object
        - domain-service
        - port

    - name: application
      kind: application
      directories:
        - src/adapters/transportLayer/**
      roles:
        - use-case
        - port
        - application-service

    - name: adapters-inbound
      kind: presentation
      directories:
        - src/adapters/*
      roles:
        - controller
        - cli-command
        - message-consumer

    - name: adapters-outbound
      kind: infrastructure
      directories: []
      roles:
        - repository
        - gateway
        - external-api-client

    # Composition root: wires adapters to ports. kind application is only a placeholder for the kind resolver.
    - name: config
      kind: application
      directories:
        - src/server.ts
      roles:
        - composition-root
        - module

  # `from` may import each layer in `to`; any other cross-layer import is a violation.
  allowed_dependencies:
    # observed: adapters-inbound -> application 1/1 files; adapters-inbound -> domain 1/1 files
    - from: adapters-inbound
      to:
        - application
        - domain
    # observed: config -> adapters-inbound 1/1 files; config -> application 1/1 files
    - from: config
      to:
        - adapters-inbound
        - application

