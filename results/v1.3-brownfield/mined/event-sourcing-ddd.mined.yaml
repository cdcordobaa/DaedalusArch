spec_version: "1.0.0"

architecture:
  style: clean-architecture

  layers:
    - name: domain
      directories:
        - src/domain/**
        - src/config/**
        - src/constants/**
        - src/core/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: application
      directories:
        - src/commandHandlers/book/**
        - src/commandHandlers/user/**
        - src/commands/book/**
        - src/commands/user/**
        - src/eventHandlers/author/**
        - src/eventHandlers/book/**
        - src/eventHandlers/user/**
        - src/interfaces/**
        - src/projection/author/**
        - src/projection/book/**
      roles:
        - use-case
        - dto
        - application-service

    - name: infrastructure
      directories:
        - src/infrastructure/**
        - src/entrypoint.ts
      roles:
        - repository-impl
        - controller
        - middleware
        - orm-entity

