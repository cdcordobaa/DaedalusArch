# style: nestjs (ISE, confidence 0.67); layers: ISE preset-first
# mined rules: 10 (9 emitted)
# MR-001 [layer-direction, low 0.42] domain must not depend on infrastructure (1 edges infrastructure -> domain; 0/5 domain files import infrastructure)
# MR-002 [layer-direction, high 0.77] domain must not depend on application (12 edges application -> domain; 0/5 domain files import application)
# MR-003 [layer-direction, medium 0.56] domain must not depend on presentation (2 edges presentation -> domain; 0/5 domain files import presentation)
