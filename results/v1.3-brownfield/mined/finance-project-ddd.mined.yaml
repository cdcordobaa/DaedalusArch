# MR-005 [layer-direction, medium 0.67] infrastructure must not depend on presentation (4 edges presentation -> infrastructure; 0/5 infrastructure files import presentation)
# MR-006 [layer-direction, high 0.95] application must not depend on infrastructure (20 edges infrastructure -> application; 0/144 application files import infrastructure)
