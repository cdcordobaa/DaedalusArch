spec_version: "1.0.0"

architecture:
  style: clean-architecture

  layers:
    - name: domain
      directories:
        - src/domain/**
        - src/common/helpers/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: application
      directories:
        - src/application/**
        - src/common/adapters/**
        - src/presentation/controllers/**
        - src/presentation/middlewares/**
        - src/presentation/responses/**
      roles:
        - use-case
        - dto
        - application-service

    - name: infrastructure
      directories:
        - src/infrastructure/**
        - src/main/factories/controllers/**
        - src/main/factories/middlewares/**
      roles:
        - repository-impl
        - controller
        - middleware
        - orm-entity

