# MR-010 [component-direction, high 0.78] folder component domain must not depend on main (5 imports main -> domain; 0/16 files import back)
# MR-011 [component-direction, high 0.88] folder component domain must not depend on presentation (15 imports presentation -> domain; 0/16 files import back)
