# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: nestjs (ISE, confidence 0.86); layers: ISE preset-first
# mined rules: 9 (9 emitted)
# MR-001 [layer-direction, low 0.47] domain must not depend on application (18 edges application -> domain; 0/1 domain files import application)
# MR-002 [layer-direction, low 0.38] domain must not depend on presentation (3 edges presentation -> domain; 0/1 domain files import presentation)
# MR-003 [layer-direction, high 0.85] application must not depend on presentation (142 edges presentation -> application; 11/151 application files import presentation) -- 11 exception(s): src/app/_helpers/graphql/index.ts -> src/app/_helpers/graphql/graphql.guard.ts, src/app/app.dispatcher.ts -> src/app/app.module.ts, src/app/contract/contract.resolver.ts -> src/app/_helpers/graphql/graphql.guard.ts, ...
# MR-004 [component-direction, high 0.80] folder component app must not depend on migrations (4 imports migrations -> app; 0/173 files import back)
# MR-005 [component-direction, low 0.48] folder component config must not depend on app (20 imports app -> config; 0/1 files import back)
# MR-006 [component-direction, low 0.25] folder component config must not depend on base (1 imports base -> config; 0/1 files import back)
# MR-007 [public-api, high 0.95] imports into folder component config go through its entry files (src/config/index.ts): 21/21
# MR-008 [public-api, high 0.91] imports into folder component base go through its entry files (src/base/index.ts): 10/10
# MR-009 [core-package-free, medium 0.50] domain (a core layer: it may depend on no other layer) imports none of @nestjs/common, @nestjs/core, @nestjs/graphql, @nestjs/passport, @nestjs/swagger, async, aws-sdk, axios, class-transformer, class-validator, cls-hooked, cors, crypto, express, faker, firebase-admin, googleapis, graphql, graphql-subscriptions, helmet, jsonwebtoken, lodash, luxon, mongodb, multer-s3, nestjs-command, nodemailer, passport-jwt, path, qs-middleware, rxjs, twing, uuid, voucher-code-generator, winston

spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/config/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories: []
      file_patterns: []
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories:
        - src/app/_helpers/database/deep-partial.ts
        - src/app/_helpers/database/index.ts
        - src/app/_helpers/database/repository.interface.ts
        - src/app/_helpers/database/typeorm-filter.mapper.ts
