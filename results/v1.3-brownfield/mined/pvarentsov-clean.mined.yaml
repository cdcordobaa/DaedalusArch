# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: clean-architecture (ISE, confidence 0.70); layers: ISE preset-first
# mined rules: 11 (9 emitted)
# MR-001 [layer-direction, high 0.98] domain must not depend on application (85 edges application -> domain; 0/101 domain files import application)
# MR-002 [layer-direction, high 0.98] domain must not depend on infrastructure (82 edges infrastructure -> domain; 0/101 domain files import infrastructure)
# MR-003 [layer-direction, high 0.95] infrastructure must not depend on application (37 edges application -> infrastructure; 0/39 infrastructure files import application)
# MR-004 [acyclic-files, high 0.99] no file lies on an import cycle (184/184 files do not)
# MR-005 [component-direction, high 0.95] folder component infrastructure must not depend on application (37 imports application -> infrastructure; 0/39 files import back)
# MR-006 [component-direction, high 0.98] folder component core must not depend on infrastructure (82 imports infrastructure -> core; 0/101 files import back)
# MR-007 [component-direction, high 0.98] folder component core must not depend on application (85 imports application -> core; 0/101 files import back)
# MR-008 [port-implementation, high 0.95] every *Adapter class in infrastructure implements an interface declared in another layer (20/20) -- not emitted: the existing template binds the roles Repository, Repo; Adapter is not one
# MR-009 [inject-abstractions, high 0.93] classes of application inject interfaces across layers, not concrete classes (14/14)
# MR-010 [inject-abstractions, high 0.83] classes of infrastructure inject interfaces across layers, not concrete classes (5/5) -- not emitted: the existing templates check the application-kind layer only (application), not infrastructure
# MR-011 [core-package-free, high 0.92] domain (a core layer: it may depend on no other layer) imports none of @nestjs/common, @nestjs/core, @nestjs/cqrs, @nestjs/jwt, @nestjs/passport, @nestjs/platform-express, @nestjs/swagger, @nestjs/typeorm, class-transformer, class-validator, env-var, express, minio, passport-jwt, passport-local, path, rxjs, stream, typeorm, typeorm-transactional-cls-hooked, url, uuid -- 13 exception(s): src/core/common/util/class-validator/ClassValidator.ts -> class-validator, src/core/domain/media/entity/Media.ts -> class-validator, src/core/domain/media/entity/Media.ts -> uuid, ...

spec_version: "1.0.0"

architecture:
  style: clean-architecture

  layers:
    - name: domain
      directories:
        - src/core/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories:
        - src/infrastructure/**
      roles:
        - repository-impl
        - controller
        - middleware
        - orm-entity

    - name: application
      directories:
        - src/application/**
      roles:
        - use-case
        - dto
        - application-service

