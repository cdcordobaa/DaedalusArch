# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: layered (ISE, confidence 0.67); layers: ISE preset-first
# mined rules: 16 (15 emitted)
# MR-001 [layer-direction, high 0.86] persistence must not depend on business (15 edges business -> persistence; 0/11 persistence files import business)
# MR-002 [layer-direction, high 0.87] persistence must not depend on presentation (19 edges presentation -> persistence; 0/11 persistence files import presentation)
# MR-003 [layer-direction, medium 0.75] business must not depend on presentation (14 edges presentation -> business; 0/4 business files import presentation)
# MR-004 [acyclic-files, high 0.97] no file lies on an import cycle (35/35 files do not)
# MR-005 [component-direction, medium 0.60] folder component entities must not depend on server (4 imports server -> entities; 0/3 files import back)
# MR-006 [component-direction, low 0.38] folder component entities must not depend on lib (1 imports lib -> entities; 0/3 files import back)
# MR-007 [component-direction, medium 0.50] folder component entities must not depend on managers (2 imports managers -> entities; 0/3 files import back)
# MR-008 [component-direction, medium 0.50] folder component entities must not depend on repositories (2 imports repositories -> entities; 0/3 files import back)
# MR-009 [component-direction, medium 0.73] folder component lib must not depend on server (7 imports server -> lib; 0/5 files import back)
# MR-010 [component-direction, medium 0.56] folder component lib must not depend on managers (2 imports managers -> lib; 0/5 files import back)
# MR-011 [component-direction, medium 0.50] folder component managers must not depend on server (2 imports server -> managers; 0/3 files import back)
# MR-012 [component-direction, medium 0.50] folder component repositories must not depend on managers (2 imports managers -> repositories; 0/3 files import back)
# MR-013 [public-api, high 0.90] imports into folder component entities go through its entry files (src/entities/index.ts): 9/9
# MR-014 [public-api, medium 0.67] imports into folder component managers go through its entry files (src/managers/index.ts): 2/2
# MR-015 [public-api, high 0.75] imports into folder component repositories go through its entry files (src/repositories/index.ts): 3/3
# MR-016 [core-package-free, high 0.83] persistence (a core layer: it may depend on no other layer) imports none of async, http, joi, jsonwebtoken, koa, koa-bodyparser, koa-helmet, koa-router, pino -- 1 exception(s): src/lib/database/index.ts -> async -- not emitted: domain-purity checks the domain-kind layer only (business), not persistence
# note: mined as allowed but forbidden by the layered order: presentation>persistence

spec_version: "1.0.0"

architecture:
  style: layered

  layers:
    - name: persistence
      kind: infrastructure
      directories:
        - src/entities/**
        - src/errors.ts
        - src/lib/database/**
        - src/lib/hasher/**
        - src/lib/health/**
        - src/repositories/**
      roles:
        - repository
        - data-access-object
        - orm-entity

    - name: business
      kind: domain
      directories:
        - src/lib/authentication/**
        - src/managers/**
      roles:
        - business-service
        - entity
        - value-object

    - name: presentation
      kind: presentation
      directories:
        - src/container.ts
        - src/server/**
      roles:
        - controller
        - view
        - presenter

