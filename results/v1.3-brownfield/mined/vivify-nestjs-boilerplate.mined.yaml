# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: nestjs (ISE, confidence 1.00); layers: ISE preset-first
# mined rules: 6 (5 emitted)
# MR-001 [layer-direction, low 0.46] domain must not depend on application (1 edges application -> domain; 0/11 domain files import application)
# MR-002 [layer-direction, medium 0.67] domain must not depend on presentation (8 edges presentation -> domain; 1/11 domain files import presentation) -- 1 exception(s): src/modules/common/index.ts -> src/modules/common/common.module.ts
# MR-003 [layer-rare-edge, low 0.30] application should not depend on domain (1/4 application files imports it; nothing goes back) -- 1 exception(s): src/modules/auth/auth.service.ts -> src/utils/Hash.ts -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-004 [acyclic-files, high 0.88] no file lies on an import cycle (30/33 files do not) -- 4 exception(s): src/modules/auth/auth.controller.ts -> src/modules/auth/index.ts, src/modules/auth/auth.module.ts -> src/modules/auth/auth.controller.ts, src/modules/auth/index.ts -> src/modules/auth/auth.controller.ts, ...
# MR-005 [component-direction, low 0.33] folder component utils must not depend on modules (2 imports modules -> utils; 0/1 files import back)
# MR-006 [core-package-free, high 0.83] domain (a core layer: it may depend on no other layer) imports none of @nestjs/jwt, @nestjs/passport, @nestjs/swagger, dotenv, fs, passport-jwt -- 1 exception(s): src/swagger/index.ts -> @nestjs/swagger
# note: the mined allowed graph has a cycle between layers: the layer order is left as inferred

spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/migrations/**
        - src/modules/common/decorator/current-user.decorator.ts
        - src/modules/common/index.ts
        - src/modules/common/transformer/abstract-transform.pipe.ts
        - src/modules/common/transformer/trim-strings.pipe.ts
        - src/modules/common/validator/exists.validator.ts
        - src/modules/common/validator/same-as.validator.ts
        - src/modules/common/validator/unique.validator.ts
        - src/swagger/**
        - src/utils/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories: []
      file_patterns: []
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories: []
      file_patterns:
        - "**/*.service.ts"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: presentation
      directories:
        - src/modules/auth/index.ts
        - src/modules/auth/jwt-guard.ts
        - src/modules/auth/jwt.strategy.ts
        - src/modules/auth/login.payload.ts
        - src/modules/auth/register.payload.ts
        - src/modules/user/index.ts
        - src/modules/user/password.transformer.ts
        - src/modules/user/user.entity.ts
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.module.ts"
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

fitness_functions:

  # ── STRUCTURAL ──

  # mined: MR-001 low 0.46, 0 exceptions; MR-002 medium 0.67, 1 exception
  - id: FF-S01
