# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: layered (ISE, confidence 1.00); layers: ISE preset-first
# mined rules: 14 (12 emitted)
# MR-001 [layer-direction, high 0.86] persistence must not depend on business (13 edges business -> persistence; 0/12 persistence files import business)
# MR-002 [layer-direction, high 0.86] persistence must not depend on presentation (13 edges presentation -> persistence; 0/12 persistence files import presentation)
# MR-003 [layer-direction, high 0.88] business must not depend on presentation (10 edges presentation -> business; 0/27 business files import presentation)
# MR-004 [component-direction, high 0.82] folder component api must not depend on database (6 imports database -> api; 0/24 files import back)
# MR-005 [component-direction, medium 0.72] folder component api must not depend on auth (3 imports auth -> api; 0/24 files import back)
# MR-006 [component-direction, low 0.44] folder component lib must not depend on loaders (1 imports loaders -> lib; 0/8 files import back)
# MR-007 [component-direction, medium 0.59] folder component lib must not depend on api (2 imports api -> lib; 0/8 files import back)
# MR-008 [component-direction, low 0.44] folder component lib must not depend on auth (1 imports auth -> lib; 0/8 files import back)
# MR-009 [component-direction, medium 0.59] folder component lib must not depend on decorators (2 imports decorators -> lib; 0/8 files import back)
# MR-010 [component-direction, medium 0.50] folder component auth must not depend on loaders (2 imports loaders -> auth; 0/3 files import back)
# MR-011 [component-direction, medium 0.66] folder component decorators must not depend on api (7 imports api -> decorators; 0/3 files import back)
# MR-012 [component-direction, low 0.38] folder component decorators must not depend on auth (1 imports auth -> decorators; 0/3 files import back)
# MR-013 [inject-abstractions, high 0.80] classes of business inject interfaces across layers, not concrete classes (4/4) -- not emitted: the existing templates check the application-kind layer only (none), not business
# MR-014 [core-package-free, high 0.85] persistence (a core layer: it may depend on no other layer) imports none of bcrypt, class-transformer, class-validator, class-validator-jsonschema, compression, dataloader, event-dispatch, express, express-basic-auth, express-graphql, express-status-monitor, faker, glob, helmet, microframework-w3tec, morgan, routing-controllers, routing-controllers-openapi, serve-favicon, swagger-ui-express, type-graphql, typedi, typeorm-seeding, typeorm-typedi-extensions, uuid, winston -- 4 exception(s): src/lib/graphql/graphql-error-handling.ts -> uuid, src/lib/graphql/index.ts -> dataloader, src/lib/graphql/index.ts -> typedi, ... -- not emitted: domain-purity checks the domain-kind layer only (business), not persistence
# note: mined as allowed but forbidden by the layered order: presentation>persistence

spec_version: "1.0.0"

architecture:
  style: layered

  layers:
    - name: persistence
      kind: infrastructure
      directories:
        - src/database/migrations/**
        - src/env.ts
        - src/lib/**
      roles:
        - repository
        - data-access-object
        - orm-entity

    - name: business
      kind: domain
      directories:
        - src/api/**
        - src/decorators/**
      roles:
        - business-service
        - entity
        - value-object

    - name: presentation
      kind: presentation
      directories:
        - src/auth/**
        - src/database/factories/**
        - src/database/seeds/**
        - src/loaders/**
      roles:
        - controller
        - view
        - presenter

