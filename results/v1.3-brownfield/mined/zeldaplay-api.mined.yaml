# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: nestjs (ISE, confidence 1.00); layers: ISE preset-first
# mined rules: 3 (2 emitted)
# MR-001 [layer-direction, high 0.92] application must not depend on presentation (29 edges presentation -> application; 0/20 application files import presentation)
# MR-002 [acyclic-files, high 0.99] no file lies on an import cycle (85/85 files do not)
# MR-003 [core-package-free, high 0.86] application (a core layer: it may depend on no other layer) imports none of @golevelup/nestjs-modules, @nestjs/core, compression, fs, helmet, nest-cookies, nestjs-spelunker, path, redis -- 5 exception(s): src/app/config/config.service.ts -> fs, src/app/config/config.service.ts -> path, src/app/config/config.service.ts -> redis, ... -- not emitted: domain-purity checks the domain-kind layer only (domain), not application

spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories: []
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories: []
      file_patterns: []
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories: []
      file_patterns:
        - "**/*.service.ts"
        - "**/*.dto.ts"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: presentation
      directories:
        - src/config.main.ts
        - src/spelunk.ts
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.module.ts"
        - "**/*.guard.ts"
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

