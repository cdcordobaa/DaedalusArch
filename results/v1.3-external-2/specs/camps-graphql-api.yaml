# v1.3 external set, wave 2: spec for `camps-graphql-api` (style ddd).
# Derived from presets/ddd.yaml: the `architecture:` block maps THIS project's folders
# (judgements in results/v1.3-external-2/spec-rationale.md); `fitness_functions:` is the preset's, verbatim.
# Written before any tool run on the project.

spec_version: "1.0.0"

architecture:
  style: ddd

  # README: "Code and folder structure follow Domain Driven Design principle". Layer-first layout:
  # src/{domain,application,infrastructure}/camping/... The tool's DDD model needs top-level context modules,
  # so (as event-sourcing-ddd in wave 1) the one domain folder src/domain/camping is declared the single context
  # under source_root src/domain/, with the whole folder as its public API: FF-DS02 cannot fire and the spec does
  # not assert strategic isolation the project never claimed. infrastructure/ is split by role.
  layers:
    - name: domain
      kind: domain
      directories:
        - src/domain/**
      roles:
        - aggregate
        - entity
        - value-object

    - name: application
      kind: application
      directories:
        - src/application/**
      roles:
        - application-service

    - name: infrastructure
      kind: infrastructure
      directories:
        - src/infrastructure/persistance/**
      roles:
        - repository

    - name: api
      kind: presentation
      directories:
        - src/infrastructure/api/**
        - src/infrastructure/cli/**
      roles:
        - controller

    - name: composition
      kind: application
      directories:
        - src/infrastructure/server/**
        - src/index.ts
      roles:
        - composition-root

  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]

  ddd:
    source_root: src/domain/
    contexts:
      - name: camping
        root: src/domain/camping/
        public_api: [src/domain/camping/**]
        acl: []
    outside_contexts: []
    aggregates:
      - name: Camping
        context: camping
        module: src/domain/camping/**
        root: src/domain/camping/model/write/camping.ts
        inner_entities: []
      - name: Comment
        context: camping
        module: src/domain/camping/**
        root: src/domain/camping/model/write/comment.ts
        inner_entities: []
    value_objects: ["src/domain/camping/valueObject/**"]
    repositories: ["src/infrastructure/persistance/*/repository/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/application/camping/**/*Handler.ts"]

fitness_functions:

  # ── STRATEGIC ──

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # ── TACTICAL ──

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Blocking per the sealed Docs/v1.3/rule-tiers.md. The check is still a method-name proxy (the extractor sees no
  # readonly, accessors or visibility); see Docs/v1.3-ddd-notes.md §2 for the proposed ADR.
  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Framework-free domain: the existing domain-purity template, unchanged, with the DDD package list.
  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (placement guideline).
  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # Advisory heuristic: more methods than the threshold in an application service.
  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  # ── LAYERING INSIDE EACH CONTEXT (hexagonal templates) ──

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (hexagonal does not define strict layering).
  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
