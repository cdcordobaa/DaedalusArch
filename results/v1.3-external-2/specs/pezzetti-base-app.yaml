# v1.3 external set, wave 2: spec for `pezzetti-base-app` (style ddd).
# Derived from presets/ddd.yaml: the `architecture:` block maps THIS project's folders
# (judgements in results/v1.3-external-2/spec-rationale.md); `fitness_functions:` is the preset's, verbatim.
# Written before any tool run on the project.

spec_version: "1.0.0"

architecture:
  style: ddd

  # README: "Code organization based on NestJS modules with Domain Driven Design". Contexts auth and users under
  # src/modules/. users/{domain,applications,interfaces,services,controller,resolver}; auth/shared holds the auth
  # service, guards, strategies and token types. users/services/* inject the TypeORM Repository<User> directly
  # and implement users/interfaces/services/*: they are the persistence side, so they go to infrastructure.
  layers:
    - name: domain
      kind: domain
      directories:
        - src/modules/*/domain/**
      roles:
        - aggregate
        - entity

    - name: application
      kind: application
      directories:
        - src/modules/*/applications/**
        - src/modules/*/interfaces/**
        - src/modules/auth/shared/auth.service.ts
        - src/modules/auth/shared/token.ts
        - src/modules/auth/shared/user.interface.ts
      roles:
        - application-service
        - port

    - name: infrastructure
      kind: infrastructure
      directories:
        - src/modules/*/services/**
        - src/modules/auth/shared/*.strategy.ts
      roles:
        - repository

    - name: api
      kind: presentation
      directories:
        - src/modules/*/controller/**
        - src/modules/*/resolver/**
        - src/modules/*/*.controller.ts
        - src/modules/auth/shared/*.guard.ts
        - src/common/**
      roles:
        - controller

    - name: composition
      kind: application
      directories:
        - src/main.ts
        - src/app.module.ts
        - src/ormconfig.ts
        - src/config/**
        - src/modules/*/*.module.ts
      roles:
        - composition-root

  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]

  ddd:
    source_root: src/modules/
    contexts:
      - name: auth
        root: src/modules/auth/
        public_api: []
        acl: []
      - name: users
        root: src/modules/users/
        public_api: []
        acl: []
    outside_contexts: [src/common/**, src/config/**, src/main.ts, src/app.module.ts, src/ormconfig.ts]
    aggregates:
      - name: User
        context: users
        module: src/modules/users/domain/**
        root: src/modules/users/domain/user.entity.ts
        inner_entities: []
    # No value-object, repository or domain-event files exist at the pin; these globs are the project's
    # naming convention and match nothing, so the corresponding rules check nothing (rationale).
    value_objects: ["src/modules/*/domain/*.value-object.ts"]
    repositories: ["src/modules/*/repositories/**"]
    domain_event_types: [DomainEvent]
    application_services: ["src/modules/*/applications/*.application.ts"]

fitness_functions:

  # ── STRATEGIC ──

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # ── TACTICAL ──

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Blocking per the sealed Docs/v1.3/rule-tiers.md. The check is still a method-name proxy (the extractor sees no
  # readonly, accessors or visibility); see Docs/v1.3-ddd-notes.md §2 for the proposed ADR.
  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Framework-free domain: the existing domain-purity template, unchanged, with the DDD package list.
  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (placement guideline).
  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # Advisory heuristic: more methods than the threshold in an application service.
  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  # ── LAYERING INSIDE EACH CONTEXT (hexagonal templates) ──

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (hexagonal does not define strict layering).
  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
