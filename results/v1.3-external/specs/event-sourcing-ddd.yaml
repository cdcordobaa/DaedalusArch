# v1.3 external set: spec for `event-sourcing-ddd` (style ddd).
# Derived from presets/ddd.yaml: the `architecture:` block maps THIS project's folders
# (judgements in results/v1.3-external/spec-rationale.md); `fitness_functions:` is the preset's, verbatim.
# Written before any tool run on the project.

spec_version: "1.0.0"

architecture:
  style: ddd

  # One model organised by technical folders (README: DDD + Onion + CQRS/ES). core/ = shared kernel
  # (AggregateRoot, Event, bus/store/repository interfaces). Commands, command handlers and event
  # handlers = application; projection/ (Redis read-model facades) and infrastructure/ = infrastructure;
  # interfaces/http = api; entrypoint, index, config, constants (DI symbols) = composition.
  layers:
    - name: domain
      kind: domain
      directories:
        - src/domain/**
        - src/core/**
      roles:
        - aggregate
        - domain-event
        - repository-interface

    - name: application
      kind: application
      directories:
        - src/commands/**
        - src/commandHandlers/**
        - src/eventHandlers/**
      roles:
        - application-service

    - name: infrastructure
      kind: infrastructure
      directories:
        - src/infrastructure/**
        - src/projection/**
      roles:
        - repository

    - name: api
      kind: presentation
      directories:
        - src/interfaces/http/**
      roles:
        - controller

    - name: composition
      kind: application
      directories:
        - src/entrypoint.ts
        - src/index.ts
        - src/config/**
        - src/constants/**
      roles:
        - composition-root

  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]

  ddd:
    # The project is ONE bounded context with technical top-level folders. The tool's context model needs
    # top-level context modules, so the two aggregate folders under src/domain/ are declared as contexts
    # with the whole folder as public API: strategic isolation (FF-DS02) is thereby not asserted.
    source_root: src/domain/
    contexts:
      - name: book
        root: src/domain/book/
        public_api: [src/domain/book/**]
        acl: []
      - name: user
        root: src/domain/user/
        public_api: [src/domain/user/**]
        acl: []
    outside_contexts: []
    aggregates:
      - name: Book
        context: book
        module: src/domain/book/**
        root: src/domain/book/Book.ts
        inner_entities: []
      - name: User
        context: user
        module: src/domain/user/**
        root: src/domain/user/User.ts
        inner_entities: []
    # The project has no value-object classes. FF-DT03 needs a non-empty pattern (BR-SPEC-10), so the
    # conventional name is declared; it matches no file at the pin, which makes FF-DT03 vacuous here.
    value_objects: ["src/domain/**/*ValueObject.ts"]
    repositories: ["src/domain/*/I*Repository.ts", "src/infrastructure/repositories/**"]
    domain_event_types: [IEvent, Event]
    application_services: ["src/commandHandlers/**/*.ts"]

fitness_functions:

  # ── STRATEGIC ──

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # ── TACTICAL ──

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Blocking per the sealed Docs/v1.3/rule-tiers.md. The check is still a method-name proxy (the extractor sees no
  # readonly, accessors or visibility); see Docs/v1.3-ddd-notes.md §2 for the proposed ADR.
  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Framework-free domain: the existing domain-purity template, unchanged, with the DDD package list.
  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (placement guideline).
  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # Advisory heuristic: more methods than the threshold in an application service.
  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  # ── LAYERING INSIDE EACH CONTEXT (hexagonal templates) ──

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (hexagonal does not define strict layering).
  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
