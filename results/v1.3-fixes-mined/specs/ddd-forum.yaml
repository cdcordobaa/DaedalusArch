# v1.3 external set: spec for `ddd-forum` (style ddd).
# Derived from presets/ddd.yaml: the `architecture:` block maps THIS project's folders
# (judgements in results/v1.3-external/spec-rationale.md); `fitness_functions:` is the preset's, verbatim.
# Written before any tool run on the project.

spec_version: "1.0.0"

architecture:
  style: ddd

  # Two bounded contexts as top-level modules (src/modules/forum, src/modules/users); shared kernel
  # src/shared/. repos/*.ts are repository interfaces (domain), repos/implementations/** Sequelize repos.
  layers:
    - name: domain
      kind: domain
      directories:
        - src/modules/*/domain/**
        - src/modules/*/repos/*.ts
        - src/shared/domain/**
        - src/shared/core/**
      roles:
        - aggregate
        - entity
        - value-object
        - domain-event
        - repository-interface

    - name: application
      kind: application
      directories:
        - src/modules/*/useCases/**/!(*Controller).ts
        - src/modules/*/subscriptions/**
        - src/modules/*/dtos/**
        - src/modules/*/services/*.ts
      roles:
        - application-service
        - port

    - name: infrastructure
      kind: infrastructure
      directories:
        - src/modules/*/repos/implementations/**
        - src/modules/*/mappers/**
        - src/modules/*/services/redis/**
        - src/shared/infra/database/**
        - src/shared/infra/*.ts
      roles:
        - repository

    - name: api
      kind: presentation
      directories:
        - src/modules/*/infra/http/**
        - src/modules/*/useCases/**/*Controller.ts
        - src/shared/infra/http/**
      roles:
        - controller

    - name: composition
      kind: application
      directories:
        - src/index.ts
        - src/config/**
      roles:
        - composition-root

  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]

  ddd:
    source_root: src/modules/
    # Neither context publishes a barrel or contracts folder, so no public API is declared.
    contexts:
      - name: forum
        root: src/modules/forum/
        public_api: []
        acl: []
      - name: users
        root: src/modules/users/
        public_api: []
        acl: []
    outside_contexts: []
    # The forum domain folder is flat, so aggregate modules are the whole domain folder of the context.
    aggregates:
      - name: Post
        context: forum
        module: src/modules/forum/domain/**
        root: src/modules/forum/domain/post.ts
        inner_entities: [src/modules/forum/domain/comment.ts, src/modules/forum/domain/postVote.ts, src/modules/forum/domain/commentVote.ts]
      - name: Member
        context: forum
        module: src/modules/forum/domain/**
        root: src/modules/forum/domain/member.ts
        inner_entities: []
      - name: User
        context: users
        module: src/modules/users/domain/**
        root: src/modules/users/domain/user.ts
        inner_entities: []
    value_objects:
      - src/modules/users/domain/userName.ts
      - src/modules/users/domain/userPassword.ts
      - src/modules/users/domain/userEmail.ts
      - src/modules/users/domain/emailVerificationToken.ts
      - src/modules/forum/domain/commentDetails.ts
      - src/modules/forum/domain/postLink.ts
      - src/modules/forum/domain/memberDetails.ts
      - src/modules/forum/domain/postTitle.ts
      - src/modules/forum/domain/commentText.ts
      - src/modules/forum/domain/postText.ts
      - src/modules/forum/domain/postDetails.ts
      - src/modules/forum/domain/postSlug.ts
    repositories: ["src/modules/*/repos/**"]
    domain_event_types: [IDomainEvent]
    application_services: ["src/modules/*/useCases/**/!(*Controller|*DTO|*Errors|index).ts"]

fitness_functions:

  # ── STRATEGIC ──

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # ── TACTICAL ──

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Blocking per the sealed Docs/v1.3/rule-tiers.md. The check is still a method-name proxy (the extractor sees no
  # readonly, accessors or visibility); see Docs/v1.3-ddd-notes.md §2 for the proposed ADR.
  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Framework-free domain: the existing domain-purity template, unchanged, with the DDD package list.
  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (placement guideline).
  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # Advisory heuristic: more methods than the threshold in an application service.
  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  # ── LAYERING INSIDE EACH CONTEXT (hexagonal templates) ──

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (hexagonal does not define strict layering).
  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
