# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: ddd (ISE, confidence 0.75); layers: ISE preset-first
# mined rules: 18 (15 emitted)
# MR-001 [layer-direction, high 0.87] domain must not depend on application (13 edges application -> domain; 0/16 domain files import application)
# MR-002 [layer-direction, high 0.85] domain must not depend on infrastructure (9 edges infrastructure -> domain; 0/16 domain files import infrastructure)
# MR-003 [layer-unobserved, low 0.31] domain must not depend on api (no import between them either way)
# MR-004 [layer-unobserved, low 0.23] domain must not depend on composition (no import between them either way)
# MR-005 [layer-direction, low 0.40] application must not depend on infrastructure (1 edges infrastructure -> application; 0/4 application files import infrastructure)
# MR-006 [layer-direction, medium 0.53] application must not depend on api (2 edges api -> application; 0/4 application files import api)
# MR-007 [layer-direction, medium 0.60] application must not depend on composition (3 edges composition -> application; 0/4 application files import composition)
# MR-008 [layer-rare-edge, low 0.30] infrastructure should not depend on application (1/4 infrastructure files imports it; nothing goes back) -- 1 exception(s): src/indigo/billing/acl/OrderingAcl.ts -> src/indigo/billing/orchid/ports/OrderSource.ts
# MR-009 [layer-unobserved, low 0.27] infrastructure must not depend on api (no import between them either way)
# MR-010 [layer-direction, medium 0.64] infrastructure must not depend on composition (4 edges composition -> infrastructure; 0/4 infrastructure files import composition)
# MR-011 [layer-unobserved, low 0.31] api must not depend on domain (no import between them either way)
# MR-012 [layer-unobserved, low 0.27] api must not depend on infrastructure (no import between them either way)
# MR-013 [layer-direction, low 0.44] api must not depend on composition (2 edges composition -> api; 0/2 api files import composition)
# MR-014 [layer-unobserved, low 0.23] composition must not depend on domain (no import between them either way)
# MR-015 [acyclic-files, high 0.97] no file lies on an import cycle (31/31 files do not) -- not emitted: the ddd style compiles only its own library and the hexagonal graph templates; no-cyclic-deps is not among them
# MR-016 [component-direction, low 0.47] module component ordering must not depend on billing (1 imports billing -> ordering; 0/16 files import back)
# MR-017 [port-implementation, high 0.75] every *Repository class in infrastructure implements an interface declared in another layer (3/3) -- not emitted: the ddd library has no port template (repository-aggregate-root checks aggregate roots, not ports)
# MR-018 [inject-abstractions, high 0.80] classes of application inject interfaces across layers, not concrete classes (4/4) -- not emitted: the ddd library has no injection template

spec_version: "1.0.0"

architecture:
  style: ddd

  layers:
    - name: domain
      kind: domain
      directories:
        - src/indigo/billing/prairie/**
        - src/indigo/ordering/prairie/**
        - src/indigo/shared-kernel/**
      roles:
        - aggregate
        - entity
        - value-object
        - domain-event
        - repository-interface

    - name: application
      kind: application
      directories:
        - src/indigo/billing/orchid/**
        - src/indigo/ordering/orchid/**
      roles:
        - application-service
        - port

    - name: infrastructure
      kind: infrastructure
      directories:
        - src/indigo/billing/acl/**
        - src/indigo/billing/jasper/**
        - src/indigo/ordering/jasper/**
      roles:
        - repository
        - anti-corruption-layer

    - name: api
      kind: presentation
      directories:
        - src/indigo/billing/api/**
        - src/indigo/ordering/api/**
      roles:
        - controller

    # Composition root, outside every context. kind application is only a placeholder for the kind resolver.
    - name: composition
      kind: application
      directories:
        - src/indigo/main.ts
      roles:
        - composition-root

  # Layering inside each context (`from` may import each layer in `to`); cross-context imports are FF-DS02's.
  allowed_dependencies:
    # observed: application -> domain 3/4 files
    - from: application
      to:
        - domain
    # observed: infrastructure -> domain 3/4 files
    - from: infrastructure
      to:
        - domain
    # observed: api -> application 2/2 files
    - from: api
      to:
        - application
    # observed: composition -> api 1/1 files; composition -> application 1/1 files; composition -> infrastructure 1/1 files
    - from: composition
      to:
        - api
        - application
        - infrastructure

  ddd:
    source_root: src/indigo/
    contexts:
      - name: billing
        root: src/indigo/billing/
        public_api:
          - src/indigo/billing/index.ts
          - src/indigo/billing/contracts/**
        acl:
          - src/indigo/billing/acl/**
      - name: ordering
        root: src/indigo/ordering/
        public_api:
          - src/indigo/ordering/index.ts
          - src/indigo/ordering/contracts/**
        acl: []
    outside_contexts:
      - src/indigo/main.ts
      - src/indigo/shared-kernel/**
    aggregates:
      - name: Invoice
        context: billing
        module: src/indigo/billing/prairie/invoice/**
        root: src/indigo/billing/prairie/invoice/Invoice.ts
        inner_entities:
          - src/indigo/billing/prairie/invoice/InvoiceLine.ts
      - name: Customer
        context: ordering
        module: src/indigo/ordering/prairie/customer/**
        root: src/indigo/ordering/prairie/customer/Customer.ts
        inner_entities: []
      - name: Order
        context: ordering
        module: src/indigo/ordering/prairie/order/**
        root: src/indigo/ordering/prairie/order/Order.ts
        inner_entities:
          - src/indigo/ordering/prairie/order/OrderLine.ts
    value_objects:
      - src/indigo/**/value-objects/**
    repositories:
      - src/indigo/*/jasper/**/*Repository.ts
      - src/indigo/*/prairie/**/*Repository.ts
    domain_event_types:
      - DomainEvent
    application_services:
      - src/indigo/*/orchid/*.ts

