# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: nestjs (ISE, confidence 1.00); layers: ISE preset-first
# mined rules: 12 (8 emitted)
# MR-001 [layer-direction, high 0.84] domain must not depend on infrastructure (13 edges infrastructure -> domain; 0/9 domain files import infrastructure)
# MR-002 [layer-direction, high 0.83] domain must not depend on application (12 edges application -> domain; 0/9 domain files import application)
# MR-003 [layer-unobserved, low 0.23] domain must not depend on presentation (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-004 [layer-direction, medium 0.68] infrastructure must not depend on presentation (3 edges presentation -> infrastructure; 0/9 infrastructure files import presentation)
# MR-005 [layer-direction, medium 0.53] application must not depend on infrastructure (6 edges infrastructure -> application; 1/9 application files import infrastructure) -- 2 exception(s): src/meadow/registrations/registrations.bundle.ts -> src/meadow/attendees/attendees.bundle.ts, src/meadow/registrations/registrations.bundle.ts -> src/meadow/workshops/workshops.bundle.ts
# MR-006 [layer-direction, low 0.45] application must not depend on presentation (1 edges presentation -> application; 0/9 application files import presentation)
# MR-007 [layer-unobserved, low 0.23] presentation must not depend on domain (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-008 [acyclic-files, high 0.97] no file lies on an import cycle (29/29 files do not)
# MR-009 [port-implementation, medium 0.67] every *Store class in infrastructure implements an interface declared in another layer (2/2) -- not emitted: the existing template binds the roles Repository, Repo; Store is not one
# MR-010 [inject-abstractions, high 0.75] classes of application inject interfaces across layers, not concrete classes (3/3)
# MR-011 [inject-abstractions, medium 0.67] classes of infrastructure inject interfaces across layers, not concrete classes (2/2) -- not emitted: the existing templates check the application-kind layer only (application), not infrastructure
# MR-012 [core-package-free, high 0.90] domain (a core layer: it may depend on no other layer) imports none of @nestjs/core
# note: not mined as allowed but allowed by the nestjs order: presentation>domain

spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/meadow/prairie/**
        - src/meadow/willow/guards/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: application
      directories:
        - src/meadow/registrations/in-memory-registration.store.ts
        - src/meadow/registrations/registrations.bundle.ts
        - src/meadow/registrations/registrations.endpoint.ts
        - src/meadow/registrations/registrations.handler.ts
      file_patterns:
        - "**/dto/**"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: infrastructure
      directories:
        - src/meadow/attendees/attendees.bundle.ts
        - src/meadow/attendees/attendees.endpoint.ts
        - src/meadow/attendees/attendees.handler.ts
        - src/meadow/attendees/in-memory-attendee.store.ts
        - src/meadow/willow/filters/**
        - src/meadow/workshops/in-memory-workshop.store.ts
        - src/meadow/workshops/workshops.bundle.ts
        - src/meadow/workshops/workshops.endpoint.ts
        - src/meadow/workshops/workshops.handler.ts
      file_patterns: []
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: presentation
      directories:
        - src/meadow/app.bundle.ts
      file_patterns: []
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

