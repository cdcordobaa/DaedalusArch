# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: layered (ISE, confidence 1.00); layers: ISE preset-first
# mined rules: 7 (7 emitted)
# MR-001 [layer-direction, high 0.80] persistence must not depend on business (11 edges business -> persistence; 0/7 persistence files import business)
# MR-002 [layer-unobserved, low 0.39] persistence must not depend on presentation (no import between them either way)
# MR-003 [layer-direction, high 0.79] business must not depend on presentation (6 edges presentation -> business; 0/11 business files import presentation)
# MR-004 [layer-unobserved, low 0.39] presentation must not depend on persistence (no import between them either way)
# MR-005 [acyclic-files, high 0.96] no file lies on an import cycle (27/27 files do not)
# MR-006 [component-direction, high 0.79] folder component business must not depend on presentation (6 imports presentation -> business; 0/11 files import back)
# MR-007 [component-direction, high 0.80] folder component persistence must not depend on business (11 imports business -> persistence; 0/7 files import back)

spec_version: "1.0.0"

architecture:
  style: layered

  layers:
    - name: persistence
      kind: infrastructure
      directories:
        - src/persistence/**
      roles:
        - repository
        - data-access-object
        - orm-entity

    - name: business
      kind: domain
      directories:
        - src/business/**
      roles:
        - business-service
        - entity
        - value-object

    - name: presentation
      kind: presentation
      directories:
        - src/presentation/**
      roles:
        - controller
        - view
        - presenter

