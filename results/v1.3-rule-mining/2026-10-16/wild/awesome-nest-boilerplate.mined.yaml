spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/constants/**
        - src/database/**
        - src/exceptions/**
        - src/filters/**
        - src/interfaces/**
        - src/setup-swagger.ts
        - src/snake-naming.strategy.ts
        - src/test.ts
        - src/types.ts
        - src/validators/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories:
        - src/decorators/**
        - src/entity-subscribers/**
        - src/providers/**
      file_patterns: []
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories:
        - src/boilerplate.polyfill.ts
      file_patterns:
        - "**/*.service.ts"
        - "**/dto/**"
        - "**/*.dto.ts"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: presentation
      directories: []
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.module.ts"
        - "**/*.guard.ts"
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

