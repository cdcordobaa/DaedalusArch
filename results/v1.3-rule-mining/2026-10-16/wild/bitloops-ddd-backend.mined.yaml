# MR-001 [layer-unobserved, low 0.33] domain must not depend on infrastructure (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-002 [layer-unobserved, low 0.28] domain must not depend on application (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-003 [layer-direction, medium 0.53] domain must not depend on presentation (4 edges presentation -> domain; 0/2 domain files import presentation)
# MR-004 [layer-unobserved, low 0.33] infrastructure must not depend on domain (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-005 [layer-direction, medium 0.74] infrastructure must not depend on application (3 edges application -> infrastructure; 0/133 infrastructure files import application)
# MR-006 [layer-direction, high 0.98] infrastructure must not depend on presentation (64 edges presentation -> infrastructure; 0/133 infrastructure files import presentation)
# MR-007 [layer-unobserved, low 0.28] application must not depend on domain (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-008 [layer-direction, medium 0.69] application must not depend on presentation (5 edges presentation -> application; 0/5 application files import presentation)
# MR-009 [acyclic-files, high 0.94] no file lies on an import cycle (156/164 files do not) -- 12 exception(s): src/api/pub-sub-handlers/todo-added.integration-handler.ts -> src/api/todo.sse.controller.ts, src/api/pub-sub-handlers/todo-completed.integration-handler.ts -> src/api/todo.sse.controller.ts, src/api/pub-sub-handlers/todo-deleted.integration-handler.ts -> src/api/todo.sse.controller.ts, ...
# MR-010 [component-direction, high 0.94] folder component lib must not depend on api (18 imports api -> lib; 0/128 files import back)
# MR-011 [component-direction, high 0.97] folder component lib must not depend on bounded-contexts (53 imports bounded-contexts -> lib; 0/128 files import back)
# MR-012 [component-direction, low 0.44] folder component config must not depend on api (2 imports api -> config; 0/2 files import back)
# MR-013 [component-direction, low 0.33] folder component config must not depend on bounded-contexts (1 imports bounded-contexts -> config; 0/2 files import back)
# MR-014 [component-direction, high 0.76] folder component bounded-contexts must not depend on api (4 imports api -> bounded-contexts; 0/18 files import back)
# MR-015 [inject-abstractions, medium 0.67] classes of presentation inject interfaces across layers, not concrete classes (2/2) -- not emitted: the existing templates check the application-kind layer only (application), not presentation
# MR-016 [core-package-free, medium 0.67] domain (a core layer: it may depend on no other layer) imports none of @nestjs/common, @nestjs/config, @nestjs/swagger, async-mutex, async_hooks, class-validator, crypto, ddd-tactical-core-boilerplate, fastify, nats, pg, reflect-metadata, rxjs, uuid
# MR-017 [core-package-free, high 0.98] infrastructure (a core layer: it may depend on no other layer) imports none of @nestjs/config, @nestjs/swagger, class-validator, rxjs, uuid -- 2 exception(s): src/lib/infra/oidc/principal-context.interceptor.ts -> rxjs, src/lib/infra/telemetry/correlation-id.interceptor.ts -> rxjs -- not emitted: domain-purity checks the domain-kind layer only (domain), not infrastructure
# note: not mined as allowed but allowed by the nestjs order: application>domain, infrastructure>domain

spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/config/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories:
        - src/lib/**
      file_patterns:
        - "**/*.repository.ts"
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories: []
      file_patterns:
        - "**/*.service.ts"
        - "**/dto/**"
        - "**/*.dto.ts"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: presentation
      directories: []
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.module.ts"
        - "**/*.guard.ts"
        - "**/*.interceptor.ts"
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

