spec_version: "1.0.0"

architecture:
  style: clean-architecture

  layers:
    - name: domain
      directories:
        - src/domain/**
        - src/validation/protocols/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: application
      directories:
        - src/data/**
        - src/infra/cryptography/**
        - src/infra/db/**
        - src/infra/validators/**
        - src/presentation/**
        - src/validation/validators/**
      roles:
        - use-case
        - dto
        - application-service

    - name: infrastructure
      directories:
        - src/main/**
      roles:
        - repository-impl
        - controller
        - middleware
        - orm-entity

