# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: nestjs (ISE, confidence 1.00); layers: ISE preset-first
# mined rules: 11 (9 emitted)
# MR-001 [layer-direction, high 0.91] domain must not depend on infrastructure (16 edges infrastructure -> domain; 0/34 domain files import infrastructure)
# MR-002 [layer-direction, high 0.79] domain must not depend on application (10 edges application -> domain; 1/34 domain files import application) -- 1 exception(s): src/libs/api/response.base.ts -> src/libs/api/id.response.dto.ts
# MR-003 [layer-direction, high 0.90] domain must not depend on presentation (12 edges presentation -> domain; 0/34 domain files import presentation)
# MR-004 [layer-unobserved, low 0.42] infrastructure must not depend on application (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-005 [layer-direction, high 0.82] infrastructure must not depend on presentation (9 edges presentation -> infrastructure; 0/11 infrastructure files import presentation)
# MR-006 [layer-unobserved, low 0.42] application must not depend on infrastructure (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-007 [layer-direction, high 0.83] application must not depend on presentation (9 edges presentation -> application; 0/12 application files import presentation)
# MR-008 [component-direction, low 0.49] folder component libs must not depend on configs (1 imports configs -> libs; 0/37 files import back)
# MR-009 [component-direction, high 0.95] folder component libs must not depend on modules (43 imports modules -> libs; 0/37 files import back)
# MR-010 [component-direction, medium 0.50] folder component configs must not depend on modules (3 imports modules -> configs; 0/2 files import back)
# MR-011 [core-package-free, high 0.89] domain (a core layer: it may depend on no other layer) imports none of @nestjs/apollo, @nestjs/common, @nestjs/core, @nestjs/cqrs, @nestjs/event-emitter, @nestjs/graphql, @nestjs/microservices, @nestjs/swagger, class-transformer, class-validator, crypto, env-var, nestjs-console, nestjs-request-context, nestjs-slonik, oxide.ts, rxjs, slonik, zod -- 17 exception(s): src/libs/api/api-error.response.ts -> @nestjs/swagger, src/libs/api/graphql/paginated.graphql-response.base.ts -> @nestjs/common, src/libs/api/graphql/paginated.graphql-response.base.ts -> @nestjs/graphql, ...
# note: not mined as allowed but allowed by the nestjs order: application>infrastructure

spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/libs/api/api-error.response.ts
        - src/libs/api/graphql/paginated.graphql-response.base.ts
        - src/libs/api/paginated.response.base.ts
        - src/libs/api/response.base.ts
        - src/libs/application/context/AppRequestContext.ts
        - src/libs/application/context/ContextInterceptor.ts
        - src/libs/db/sql-repository.base.ts
        - src/libs/ddd/aggregate-root.base.ts
        - src/libs/ddd/command.base.ts
        - src/libs/ddd/domain-event.base.ts
        - src/libs/ddd/entity.base.ts
        - src/libs/ddd/index.ts
        - src/libs/ddd/mapper.interface.ts
        - src/libs/ddd/query.base.ts
        - src/libs/ddd/repository.port.ts
        - src/libs/ddd/value-object.base.ts
        - src/libs/decorators/final.decorator.ts
        - src/libs/decorators/frozen.decorator.ts
        - src/libs/decorators/index.ts
        - src/libs/exceptions/exception.base.ts
        - src/libs/exceptions/exception.codes.ts
        - src/libs/exceptions/exceptions.ts
        - src/libs/exceptions/index.ts
        - src/libs/guard.ts
        - src/libs/ports/logger.port.ts
        - src/libs/types/deep-partial.type.ts
        - src/libs/types/index.ts
        - src/libs/types/mutable.type.ts
        - src/libs/types/non-function-properties.type.ts
        - src/libs/types/object-literal.type.ts
        - src/libs/types/require-one.type.ts
        - src/libs/utils/convert-props-to-object.util.ts
        - src/libs/utils/dotenv.ts
        - src/libs/utils/index.ts
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories:
        - src/configs/**
        - src/modules/wallet/application/event-handlers/create-wallet-when-user-is-created.domain-event-handler.ts
        - src/modules/wallet/database/wallet.repository.port.ts
        - src/modules/wallet/domain/events/wallet-created.domain-event.ts
        - src/modules/wallet/domain/wallet.entity.ts
        - src/modules/wallet/domain/wallet.errors.ts
        - src/modules/wallet/wallet.di-tokens.ts
        - src/modules/wallet/wallet.mapper.ts
      file_patterns:
        - "**/*.repository.ts"
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories: []
      file_patterns:
        - "**/*.service.ts"
        - "**/*.dto.ts"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: presentation
      directories: []
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.module.ts"
        - "**/*.interceptor.ts"
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

