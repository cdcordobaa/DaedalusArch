# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: layered (ISE, confidence 1.00); layers: ISE preset-first
# mined rules: 5 (4 emitted)
# MR-001 [layer-direction, high 0.91] persistence must not depend on business (55 edges business -> persistence; 2/78 persistence files import business) -- 2 exception(s): src/node/db/API.ts -> src/node/handler/PadMessageHandler.ts, src/node/db/Pad.ts -> src/node/handler/PadMessageHandler.ts
# MR-002 [layer-direction, high 0.95] persistence must not depend on presentation (79 edges presentation -> persistence; 1/78 persistence files import presentation) -- 1 exception(s): src/node/db/SecurityManager.ts -> src/node/hooks/express/webaccess.ts
# MR-003 [layer-direction, high 0.88] business must not depend on presentation (29 edges presentation -> business; 1/34 business files import presentation) -- 1 exception(s): src/node/handler/PadMessageHandler.ts -> src/node/hooks/express/webaccess.ts
# MR-004 [acyclic-files, high 0.94] no file lies on an import cycle (126/133 files do not) -- 16 exception(s): src/node/db/AuthorManager.ts -> src/node/db/PadManager.ts, src/node/db/GroupManager.ts -> src/node/db/PadManager.ts, src/node/db/GroupManager.ts -> src/node/db/SessionManager.ts, ...
# MR-005 [core-package-free, high 0.90] persistence (a core layer: it may depend on no other layer) imports none of assert, buffer, child_process, chokidar, cookie-parser, cross-spawn, crypto, ep_etherpad-lite, esbuild, events, express, express-rate-limit, express-session, formidable, fs, html-to-docx, http, http-errors, http2, https, jose, languages4translatewiki, lodash.clonedeep, lru-cache, net, nodemailer, oidc-provider, openapi-backend, os, prom-client, proxy-addr, querystring, rate-limiter-flexible, semver, socket.io, underscore, url, util -- 32 exception(s): src/node/db/Pad.ts -> assert, src/node/db/PadDeletionManager.ts -> crypto, src/node/db/SessionStore.ts -> express-session, ... -- not emitted: domain-purity checks the domain-kind layer only (business), not persistence
# note: mined as allowed but forbidden by the layered order: presentation>persistence

spec_version: "1.0.0"

architecture:
  style: layered

  layers:
    - name: persistence
      kind: infrastructure
      directories:
        - src/node/db/**
        - src/node/eejs/**
        - src/node/metrics.ts
        - src/node/stats.ts
        - src/node/types/**
        - src/node/utils/**
      roles:
        - repository
        - data-access-object
        - orm-entity

    - name: business
      kind: domain
      directories:
        - src/node/handler/**
        - src/node/padaccess.ts
        - src/node/prom-instruments.ts
        - src/node/security/**
        - src/node/updater/**
      roles:
        - business-service
        - entity
        - value-object

    - name: presentation
      kind: presentation
      directories:
        - src/node/hooks/**
        - src/node/prometheus.ts
      roles:
        - controller
        - view
        - presenter

