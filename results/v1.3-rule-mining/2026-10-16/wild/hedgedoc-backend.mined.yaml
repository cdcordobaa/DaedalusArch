spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/events.ts
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories:
        - src/config/**
        - src/database/**
        - src/errors/**
        - src/media/backends/azure-backend.ts
        - src/media/backends/filesystem-backend.ts
        - src/media/backends/imgur-backend.ts
        - src/media/backends/s3-backend.ts
        - src/media/backends/webdav-backend.ts
        - src/media/media-backend.interface.ts
        - src/media/media-response.interface.ts
        - src/media/multer-file.interface.ts
        - src/realtime/realtime-note/realtime-connection.ts
        - src/realtime/realtime-note/realtime-note-store.ts
        - src/realtime/realtime-note/realtime-note.ts
        - src/realtime/realtime-note/realtime-user-status-adapter.ts
        - src/realtime/realtime-note/test-utils/mock-connection.ts
        - src/realtime/realtime-note/test-utils/mock-message-transporter.ts
        - src/realtime/websocket/backend-websocket-adapter.ts
        - src/realtime/websocket/utils/extract-note-id-from-request-url.ts
        - src/utils/**
      file_patterns: []
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories:
        - src/migrate.ts
        - src/security/**
      file_patterns:
        - "**/*.service.ts"
        - "**/*.dto.ts"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: presentation
      directories:
        - src/app-init.ts
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.module.ts"
        - "**/*.guard.ts"
        - "**/*.interceptor.ts"
        - "**/*.gateway.ts"
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

