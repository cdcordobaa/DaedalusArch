        - src/oauth/**
        - src/otel/**
        - src/pubsub.ts
        - src/redis.ts
        - src/request-context-store.ts
        - src/seeds/**
        - src/server-registry.ts
        - src/storage/**
        - src/test-matchers.ts
        - src/test.setup.fetch.ts
        - src/util/**
        - src/workers/**
        - src/ws/**
      roles:
        - repository
        - data-access-object
        - orm-entity

    - name: business
      kind: domain
      directories:
        - src/admin/**
        - src/api-catalog.ts
        - src/auth/**
        - src/cds/**
        - src/cloud/azure/**
        - src/cloud/gcp/**
        - src/cors.ts
        - src/dicom/**
        - src/healthcheck.ts
        - src/keyvalue/**
        - src/mcp/**
        - src/openapi.ts
        - src/ratelimit.ts
        - src/seed.ts
        - src/webhook/**
        - src/wellknown.ts
      roles:
        - business-service
        - entity
        - value-object

    - name: presentation
      kind: presentation
      directories:
        - src/app.ts
        - src/async-batch.ts
        - src/scim/**
      roles:
        - controller
        - view
        - presenter

