architecture:
  style: layered

  layers:
    - name: persistence
      kind: infrastructure
      directories:
        - src/agent/**
        - src/ai/**
        - src/bots/**
        - src/cloud/aws/**
        - src/cloud/fission/**
        - src/config/**
        - src/constants.ts
