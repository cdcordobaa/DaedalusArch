# style: nestjs (ISE, confidence 1.00); layers: ISE preset-first
# mined rules: 16 (8 emitted)
# MR-001 [layer-unobserved, low 0.27] domain must not depend on infrastructure (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-002 [layer-unobserved, low 0.37] domain must not depend on application (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-003 [layer-direction, low 0.40] domain must not depend on presentation (1 edges presentation -> domain; 0/4 domain files import presentation)
# MR-004 [layer-unobserved, low 0.27] infrastructure must not depend on domain (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-005 [layer-direction, medium 0.50] infrastructure must not depend on application (3 edges application -> infrastructure; 0/2 infrastructure files import application)
# MR-006 [layer-unobserved, low 0.30] infrastructure must not depend on presentation (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-007 [layer-unobserved, low 0.37] application must not depend on domain (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-008 [layer-direction, high 0.86] application must not depend on presentation (15 edges presentation -> application; 0/12 application files import presentation)
# MR-009 [layer-rare-edge, low 0.41] presentation should not depend on domain (1/10 presentation files imports it; nothing goes back) -- 1 exception(s): src/user/user.controller.ts -> src/shared/pipes/validation.pipe.ts -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-010 [layer-unobserved, low 0.30] presentation must not depend on infrastructure (no import between them either way) -- not emitted: style nestjs orders its layers totally: dependency-direction allows every inward import, and no-layer-skip applies to the layered style only
# MR-011 [component-direction, low 0.25] folder component shared must not depend on user (1 imports user -> shared; 0/1 files import back)
# MR-012 [component-direction, low 0.46] folder component user must not depend on tag (1 imports tag -> user; 0/12 files import back)
# MR-013 [component-direction, high 0.79] folder component user must not depend on profile (6 imports profile -> user; 0/12 files import back)
# MR-014 [component-direction, medium 0.68] folder component user must not depend on article (8 imports article -> user; 1/12 files import back) -- 1 exception(s): src/user/user.entity.ts -> src/article/article.entity.ts
# MR-015 [core-package-free, high 0.80] domain (a core layer: it may depend on no other layer) imports none of @mikro-orm/nestjs, @nestjs/swagger, crypto, jsonwebtoken
# MR-016 [core-package-free, medium 0.67] infrastructure (a core layer: it may depend on no other layer) imports none of @mikro-orm/migrations, @mikro-orm/nestjs, @nestjs/common, @nestjs/swagger, class-transformer, class-validator, crypto, jsonwebtoken -- not emitted: domain-purity checks the domain-kind layer only (domain), not infrastructure
# note: not mined as allowed but allowed by the nestjs order: application>domain, infrastructure>domain, presentation>infrastructure

spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/migrations/**
        - src/shared/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories:
        - src/entities.generated.ts
      file_patterns:
        - "**/*.repository.ts"
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories:
        - src/seeders/**
      file_patterns:
        - "**/*.service.ts"
        - "**/dto/**"
        - "**/*.dto.ts"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: presentation
      directories: []
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.module.ts"
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

