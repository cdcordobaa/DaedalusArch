spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/domain/**
        - src/common/files.ts
        - src/common/mapChunk.ts
        - src/common/money.ts
        - src/common/uploaded-file.decorator.ts
        - src/environments/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories:
        - src/prisma/**
        - src/config/configuration.ts
        - src/config/cors.config.ts
        - src/config/exceptions.config.ts
        - src/config/helmet.config.ts
        - src/config/shutdown.config.ts
        - src/config/swagger.config.ts
        - src/config/validation.config.ts
        - src/email/email.interface.ts
        - src/email/template.interface.ts
        - src/email/template.service.spec-adapter.ts
      file_patterns: []
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories:
        - src/notifications/helpers/truncateNameToBytes.ts
        - src/notifications/marketing_templates/scripts/delete-templates.ts
        - src/notifications/marketing_templates/scripts/upload-templates.ts
        - src/notifications/marketing_templates/template.type.ts
        - src/notifications/providers/notifications.interface.providers.ts
        - src/notifications/providers/notifications.sendgrid.provider.ts
        - src/notifications/providers/notifications.sendgrid.types.ts
      file_patterns:
        - "**/*.service.ts"
        - "**/dto/**"
        - "**/*.dto.ts"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: presentation
      directories: []
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.module.ts"
        - "**/*.guard.ts"
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

