# PROPOSED rules, mined from the code (daedalus mine-rules; src/rule-mining). Not a reviewed spec: review before use.
# style: layered (ISE, confidence 1.00); layers: ISE preset-first
# mined rules: 8 (7 emitted)
# MR-001 [layer-direction, medium 0.75] persistence must not depend on business (47 edges business -> persistence; 1/8 persistence files import business) -- 1 exception(s): src/features/storage/router.ts -> src/middleware/rate-limit/index.ts
# MR-002 [layer-direction, medium 0.67] persistence must not depend on presentation (3 edges presentation -> persistence; 0/8 persistence files import presentation)
# MR-003 [layer-direction, high 0.93] business must not depend on presentation (15 edges presentation -> business; 0/105 business files import presentation)
# MR-004 [acyclic-files, high 0.99] no file lies on an import cycle (115/115 files do not)
# MR-005 [component-direction, high 0.94] folder component features must not depend on routers (17 imports routers -> features; 0/100 files import back)
# MR-006 [component-direction, low 0.47] folder component middleware must not depend on features (19 imports features -> middleware; 0/1 files import back)
# MR-007 [component-direction, medium 0.73] folder component dto must not depend on features (21 imports features -> dto; 1/9 files import back) -- 1 exception(s): src/dto/web-access.ts -> src/features/web-access/contracts.ts
# MR-008 [core-package-free, high 0.89] persistence (a core layer: it may depend on no other layer) imports none of @ai-sdk/anthropic, @ai-sdk/cerebras, @ai-sdk/cohere, @ai-sdk/deepseek, @ai-sdk/fireworks, @ai-sdk/google, @ai-sdk/groq, @ai-sdk/mistral, @ai-sdk/openai, @ai-sdk/openai-compatible, @ai-sdk/perplexity, @ai-sdk/togetherai, @ai-sdk/xai, @orpc/client, @reactive-resume/ai, @reactive-resume/docx, @reactive-resume/email, @reactive-resume/import, @reactive-resume/odt, @reactive-resume/pdf, @reactive-resume/resume, @reactive-resume/schema, ai, bcryptjs, dns, drizzle-zod, events, fflate, https, jsonrepair, ollama-ai-provider-v2, pdfjs-dist, resumable-stream, sanitize-html, tokenx, ts-pattern, util -- not emitted: domain-purity checks the domain-kind layer only (business), not persistence
# note: mined as allowed but forbidden by the layered order: presentation>persistence

spec_version: "1.0.0"

architecture:
  style: layered

  layers:
    - name: persistence
      kind: infrastructure
      directories:
        - src/context.ts
        - src/features/storage/**
        - src/pagination.ts
        - src/redis.ts
      roles:
        - repository
        - data-access-object
        - orm-entity

    - name: business
      kind: domain
      directories:
        - src/dto/**
        - src/features/agent/**
        - src/features/ai-providers/**
        - src/features/ai/**
        - src/features/applications/**
        - src/features/auth/**
        - src/features/career/**
        - src/features/cover-letters/**
        - src/features/documents/**
        - src/features/flags/**
        - src/features/mcp/**
        - src/features/resume/**
        - src/features/statistics/**
        - src/features/web-access/**
        - src/middleware/**
      roles:
        - business-service
        - entity
        - value-object

    - name: presentation
      kind: presentation
      directories:
        - src/routers/**
      roles:
        - controller
        - view
        - presenter

