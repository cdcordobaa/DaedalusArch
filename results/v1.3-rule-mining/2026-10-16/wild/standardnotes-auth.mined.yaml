spec_version: "1.0.0"

architecture:
  style: clean-architecture

  layers:
    - name: domain
      directories:
        - src/Domain/**
        - src/Projection/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: application
      directories:
        - src/Controller/**
        - src/Infra/Http/**
        - src/Infra/InMemory/**
        - src/Infra/Redis/**
        - src/Infra/S3/**
        - src/Infra/TypeORM/**
        - src/Infra/gRPC/**
        - src/Mapping/**
      roles:
        - use-case
        - dto
        - application-service

    - name: infrastructure
      directories:
        - src/Bootstrap/**
        - src/Infra/InversifyExpressUtils/**
        - src/Infra/WebSockets/**
      roles:
        - repository-impl
        - controller
        - middleware
        - orm-entity

