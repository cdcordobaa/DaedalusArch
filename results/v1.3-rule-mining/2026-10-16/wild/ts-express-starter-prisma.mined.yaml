# MR-015 [component-direction, medium 0.56] folder component dtos must not depend on routes (3 imports routes -> dtos; 0/3 files import back)
# MR-016 [component-direction, medium 0.50] folder component dtos must not depend on controllers (2 imports controllers -> dtos; 0/3 files import back)
# MR-017 [component-direction, medium 0.53] folder component utils must not depend on middlewares (2 imports middlewares -> utils; 0/4 files import back)
# MR-018 [component-direction, medium 0.64] folder component utils must not depend on services (4 imports services -> utils; 0/4 files import back)
# MR-019 [component-direction, medium 0.60] folder component utils must not depend on controllers (3 imports controllers -> utils; 0/4 files import back)
# MR-020 [component-direction, low 0.40] folder component utils must not depend on repositories (1 imports repositories -> utils; 0/4 files import back)
