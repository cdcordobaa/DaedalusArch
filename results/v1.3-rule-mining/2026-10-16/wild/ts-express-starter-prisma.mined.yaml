# MR-023 [component-direction, low 0.33] folder component repositories must not depend on middlewares (1 imports middlewares -> repositories; 0/2 files import back)
# MR-024 [component-direction, medium 0.50] folder component repositories must not depend on services (3 imports services -> repositories; 0/2 files import back)
# MR-025 [port-implementation, high 0.75] every *Route class in application implements an interface declared in another layer (3/3) -- not emitted: the existing templates check the infrastructure-kind layer only (infrastructure), not application
# MR-026 [core-package-free, high 0.82] domain (a core layer: it may depend on no other layer) imports none of @prisma/client, bcryptjs, compression, cookie-parser, cors, dotenv, express-rate-limit, fs, helmet, hpp, jsonwebtoken, morgan, path, pino, reflect-metadata, tsyringe -- 1 exception(s): src/entities/user.entity.ts -> @prisma/client

spec_version: "1.0.0"

architecture:
  style: clean-architecture

  layers:
    - name: domain
      directories:
        - src/dtos/**
        - src/entities/**
        - src/exceptions/**
        - src/interfaces/**
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: application
      directories:
        - src/app.ts
        - src/config/**
        - src/controllers/**
        - src/middlewares/**
        - src/repositories/**
        - src/routes/**
        - src/services/**
        - src/utils/**
      roles:
        - use-case
        - dto
        - application-service

    - name: infrastructure
      directories: []
      roles:
        - repository-impl
        - controller
        - middleware
        - orm-entity

