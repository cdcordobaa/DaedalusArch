# Author-B spec for external-set repo ddd-forum (v1.3 K2, spec-author reliability).
# Fitness functions, thresholds and weights copied verbatim from presets/ddd.yaml; only the
# architecture block (layer globs, DDD declarations) and default_exclude_paths are authored here.
# Rationale: results/v1.3-spec-author-b/spec-rationale.md

spec_version: "1.0.0"

architecture:
  style: ddd

  layers:
    - name: domain
      kind: domain
      directories:
        - "src/modules/*/domain/**"
        - "src/shared/domain/**"
        - "src/shared/core/**"
        - "src/modules/*/repos/*Repo.ts"
      roles:
        - aggregate
        - entity
        - value-object
        - domain-event
        - repository-interface

    - name: application
      kind: application
      directories:
        - "src/modules/*/useCases/**/!(*Controller|index).ts"
        - "src/modules/*/subscriptions/!(index).ts"
        - "src/modules/*/dtos/**"
        - "src/modules/*/services/authService.ts"
      roles:
        - application-service
        - port

    - name: infrastructure
      kind: infrastructure
      directories:
        - "src/modules/*/repos/implementations/**"
        - "src/modules/*/repos/index.ts"
        - "src/modules/*/mappers/**"
        - "src/modules/*/services/redis/**"
        - "src/shared/infra/database/**"
        - "src/shared/infra/Mapper.ts"
      roles:
        - repository
        - anti-corruption-layer

    - name: api
      kind: presentation
      directories:
        - "src/modules/*/infra/http/**"
        - "src/modules/*/useCases/**/*Controller.ts"
        - "src/shared/infra/http/**"
      roles:
        - controller

    - name: composition
      kind: application
      directories:
        - "src/index.ts"
        - "src/modules/*/useCases/**/index.ts"
        - "src/modules/*/subscriptions/index.ts"
        - "src/modules/*/services/index.ts"
        - "src/config/**"
      roles:
        - composition-root

  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]
  ddd:
    source_root: src/modules/
    contexts:
      - name: forum
        root: src/modules/forum/
        public_api: ["src/modules/forum/domain/events/**", "src/modules/forum/dtos/**"]
        acl: []
      - name: users
        root: src/modules/users/
        public_api: ["src/modules/users/domain/events/**", "src/modules/users/dtos/**", "src/modules/users/useCases/**/index.ts"]
        acl: []
    outside_contexts: []
    aggregates:
      - name: User
        context: users
        module: "src/modules/users/domain/**"
        root: src/modules/users/domain/user.ts
        inner_entities: []
      - name: Member
        context: forum
        module: "src/modules/forum/domain/member*.ts"
        root: src/modules/forum/domain/member.ts
        inner_entities: []
      - name: Post
        context: forum
        module: "src/modules/forum/domain/**"
        root: src/modules/forum/domain/post.ts
        inner_entities: ["src/modules/forum/domain/comment.ts", "src/modules/forum/domain/postVote.ts", "src/modules/forum/domain/commentVote.ts"]
    value_objects: ["src/modules/forum/domain/commentDetails.ts", "src/modules/forum/domain/commentText.ts", "src/modules/forum/domain/memberDetails.ts", "src/modules/forum/domain/postDetails.ts", "src/modules/forum/domain/postLink.ts", "src/modules/forum/domain/postSlug.ts", "src/modules/forum/domain/postText.ts", "src/modules/forum/domain/postTitle.ts", "src/modules/users/domain/emailVerificationToken.ts", "src/modules/users/domain/userEmail.ts", "src/modules/users/domain/userName.ts", "src/modules/users/domain/userPassword.ts"]
    repositories: ["src/modules/*/repos/*Repo.ts", "src/modules/*/repos/implementations/*.ts"]
    domain_event_types: [IDomainEvent]
    application_services: ["src/modules/forum/useCases/comments/downvoteComment/DownvoteComment.ts", "src/modules/forum/useCases/comments/getCommentByCommentId/GetCommentByCommentId.ts", "src/modules/forum/useCases/comments/getCommentsByPostSlug/GetCommentsByPostSlug.ts", "src/modules/forum/useCases/comments/replyToComment/ReplyToComment.ts", "src/modules/forum/useCases/comments/replyToPost/ReplyToPost.ts", "src/modules/forum/useCases/comments/updateCommentStats/UpdateCommentStats.ts", "src/modules/forum/useCases/comments/upvoteComment/UpvoteComment.ts", "src/modules/forum/useCases/members/createMember/CreateMember.ts", "src/modules/forum/useCases/members/getMemberByUserName/GetMemberByUserName.ts", "src/modules/forum/useCases/post/createPost/CreatePost.ts", "src/modules/forum/useCases/post/downvotePost/DownvotePost.ts", "src/modules/forum/useCases/post/editPost/EditPost.ts", "src/modules/forum/useCases/post/getPopularPosts/GetPopularPosts.ts", "src/modules/forum/useCases/post/getPostBySlug/GetPostBySlug.ts", "src/modules/forum/useCases/post/getRecentPosts/GetRecentPosts.ts", "src/modules/forum/useCases/post/updatePostStats/UpdatePostStats.ts", "src/modules/forum/useCases/post/upvotePost/UpvotePost.ts", "src/modules/users/useCases/createUser/CreateUserUseCase.ts", "src/modules/users/useCases/deleteUser/DeleteUserUseCase.ts", "src/modules/users/useCases/getUserByUserName/GetUserByUserName.ts", "src/modules/users/useCases/login/LoginUseCase.ts", "src/modules/users/useCases/logout/LogoutUseCase.ts", "src/modules/users/useCases/refreshAccessToken/RefreshAccessToken.ts"]

fitness_functions:

  # ── STRATEGIC ──

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # ── TACTICAL ──

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Blocking per the sealed Docs/v1.3/rule-tiers.md. The check is still a method-name proxy (the extractor sees no
  # readonly, accessors or visibility); see Docs/v1.3-ddd-notes.md §2 for the proposed ADR.
  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Framework-free domain: the existing domain-purity template, unchanged, with the DDD package list.
  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (placement guideline).
  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # Advisory heuristic: more methods than the threshold in an application service.
  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  # ── LAYERING INSIDE EACH CONTEXT (hexagonal templates) ──

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (hexagonal does not define strict layering).
  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70

default_exclude_paths:
  - "node_modules/**"
  - "dist/**"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "public/**"
