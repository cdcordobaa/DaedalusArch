# Author-B spec for external-set repo finance-project-ddd (v1.3 K2, spec-author reliability).
# Fitness functions, thresholds and weights copied verbatim from presets/ddd.yaml; only the
# architecture block (layer globs, DDD declarations) and default_exclude_paths are authored here.
# Rationale: results/v1.3-spec-author-b/spec-rationale.md

spec_version: "1.0.0"

architecture:
  style: ddd

  layers:
    - name: domain
      kind: domain
      directories:
        - "src/modules/*/domain/**"
        - "src/modules/shared/domain/**"
        - "src/modules/shared/interfaces/**"
        - "src/modules/shared/utils/**"
        - "src/modules/shared/proxies/**"
      roles:
        - aggregate
        - entity
        - value-object
        - domain-event
        - repository-interface

    - name: application
      kind: application
      directories:
        - "src/modules/*/application/use-cases/**"
      roles:
        - application-service
        - port

    - name: infrastructure
      kind: infrastructure
      directories:
        - "src/modules/*/infra/repo/**"
        - "src/modules/*/infra/entities/**"
        - "src/modules/*/infra/services/queries/**"
        - "src/modules/*/infra/services/strategies/**"
        - "src/modules/shared/infra/connections/**"
      roles:
        - repository
        - anti-corruption-layer

    - name: api
      kind: presentation
      directories:
        - "src/modules/*/infra/resolver/**"
        - "src/modules/*/infra/inputs/**"
        - "src/modules/*/infra/types/**"
        - "src/modules/*/infra/services/decorators/**"
        - "src/modules/*/infra/services/guards/**"
        - "src/modules/*/infra/*.service.ts"
        - "src/docs/**"
        - "src/health-check/**"
        - "src/utils/**"
        - "src/types/**"
      roles:
        - controller

    - name: composition
      kind: application
      directories:
        - "src/main.ts"
        - "src/app.module.ts"
        - "src/modules/*/infra/*.module.ts"
        - "src/modules/shared/infra/shared.module.ts"
        - "src/modules/shared/index.ts"
        - "src/config/**"
      roles:
        - composition-root

  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]
  ddd:
    source_root: src/modules/
    contexts:
      - name: budget-box
        root: src/modules/budget-box/
        public_api: []
        acl: []
      - name: transaction
        root: src/modules/transaction/
        public_api: []
        acl: []
      - name: user
        root: src/modules/user/
        public_api: ["src/modules/user/domain/index.ts"]
        acl: []
    outside_contexts: ["src/modules/shared/**"]
    aggregates:
      - name: BudgetBox
        context: budget-box
        module: "src/modules/budget-box/domain/**"
        root: src/modules/budget-box/domain/budget-box.aggregate.ts
        inner_entities: ["src/modules/budget-box/domain/reason.domain-entity.ts"]
      - name: Transaction
        context: transaction
        module: "src/modules/transaction/domain/**"
        root: src/modules/transaction/domain/transaction.aggregate.ts
        inner_entities: []
      - name: User
        context: user
        module: "src/modules/user/domain/**"
        root: src/modules/user/domain/user.aggregate.ts
        inner_entities: []
    value_objects: ["src/**/*.value-object.ts"]
    repositories: ["src/modules/*/domain/interfaces/*.repository.interface.ts", "src/modules/*/infra/repo/*.repository.ts"]
    domain_event_types: [IDomainEvent]
    application_services: ["src/modules/*/application/use-cases/**/*.use-case.ts"]

fitness_functions:

  # ── STRATEGIC ──

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # ── TACTICAL ──

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Blocking per the sealed Docs/v1.3/rule-tiers.md. The check is still a method-name proxy (the extractor sees no
  # readonly, accessors or visibility); see Docs/v1.3-ddd-notes.md §2 for the proposed ADR.
  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Framework-free domain: the existing domain-purity template, unchanged, with the DDD package list.
  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (placement guideline).
  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # Advisory heuristic: more methods than the threshold in an application service.
  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  # ── LAYERING INSIDE EACH CONTEXT (hexagonal templates) ──

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (hexagonal does not define strict layering).
  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70

default_exclude_paths:
  - "node_modules/**"
  - "dist/**"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "**/tests/**"
  - "**/mocks/**"
  - "**/*.mock.ts"
