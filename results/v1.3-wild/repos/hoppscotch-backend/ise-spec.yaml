# ISE-inferred spec (exploratory prototype, src/ise). Review before use.
# style: nestjs (classified, confidence 1.00); layer mapping: preset-first
# evidence: +3 26 @Module classes; +2 120/226 classes carry NestJS decorators; +1 125 files with NestJS dot suffixes
# units: src/access-token/=- (feature-folder), src/admin/=infrastructure (structure), src/app.controller.ts=presentation (file-pattern), src/app.module.ts=presentation (file-pattern), src/auth/=- (feature-folder), src/decorators/=domain (structure), src/errors.ts=domain (structure), src/gql-schema.ts=presentation (structure), src/guards/=presentation (file-pattern), src/health/=presentation (file-pattern), src/infra-config/=- (feature-folder), src/infra-token/=- (feature-folder), src/interceptors/=presentation (file-pattern), src/mailer/=- (feature-folder), src/main.ts=- (none), src/mock-server/=- (feature-folder), src/orchestration/=presentation (structure), src/plugins/=domain (structure), src/posthog/=- (file-pattern), src/prisma/=infrastructure (preset-glob), src/published-docs/=- (feature-folder), src/pubsub/=- (feature-folder), src/shortcode/=- (feature-folder), src/team-collection/=- (feature-folder), src/team-environments/=infrastructure (structure), src/team-invitation/=- (feature-folder), src/team-request/=- (feature-folder), src/team/=- (feature-folder), src/types/=domain (structure), src/user-collection/=application (structure), src/user-environment/=application (structure), src/user-history/=- (feature-folder), src/user-request/=application (structure), src/user-settings/=application (structure), src/user/=infrastructure (structure), src/utils.ts=domain (structure)

spec_version: "1.0.0"

architecture:
  style: nestjs

  layers:
    # Layer order (inner → outer): domain → infrastructure → application → presentation
    #
    # NestJS dependency flow: Controller → Service → Repository → ORM/DB
    # This maps to: presentation → application → infrastructure → domain
    #
    # Unlike clean-architecture (where infrastructure is outer and depends on
    # application interfaces), NestJS treats infrastructure as an inner data-access
    # layer that application services call directly.

    - name: domain
      directories:
        - src/decorators/**
        - src/errors.ts
        - src/plugins/**
        - src/types/**
        - src/utils.ts
      roles:
        - entity
        - value-object
        - domain-service
        - repository-interface

    - name: infrastructure
      directories:
        - src/prisma/**
        - src/admin/admin.model.ts
        - src/admin/admin.resolver.ts
        - src/admin/decorators/gql-admin.decorator.ts
        - src/admin/infra.model.ts
        - src/admin/infra.resolver.ts
        - src/admin/input-types.args.ts
        - src/admin/invited-user.model.ts
        - src/team-environments/input-type.args.ts
        - src/team-environments/team-environments.model.ts
        - src/team-environments/team-environments.resolver.ts
        - src/team-environments/team.resolver.ts
        - src/user/user.data.handler.ts
        - src/user/user.model.ts
        - src/user/user.resolver.ts
      file_patterns:
        - "**/strategies/**"
      roles:
        - repository-impl
        - orm-entity
        - external-service
        - middleware
        - worker

    - name: application
      directories:
        - src/user-collection/input-type.args.ts
        - src/user-collection/user-collection.resolver.ts
        - src/user-collection/user-collections.model.ts
        - src/user-environment/user-environments.model.ts
        - src/user-environment/user-environments.resolver.ts
        - src/user-environment/user.resolver.ts
        - src/user-request/input-type.args.ts
        - src/user-request/resolvers/user-collection.resolver.ts
        - src/user-request/resolvers/user-request.resolver.ts
        - src/user-request/user-request.model.ts
        - src/user-settings/user-settings.model.ts
        - src/user-settings/user-settings.resolver.ts
        - src/user-settings/user.resolver.ts
      file_patterns:
        - "**/*.service.ts"
        - "**/dto/**"
        - "**/*.dto.ts"
      roles:
        - use-case
        - dto
        - application-service
        - processor

    - name: presentation
      directories:
        - src/gql-schema.ts
        - src/orchestration/sort/sort-team-collection.resolver.ts
        - src/orchestration/sort/sort-user-collection.resolver.ts
        - src/orchestration/sort/sort.model.ts
      file_patterns:
        - "**/*.controller.ts"
        - "**/*.module.ts"
        - "**/*.guard.ts"
        - "**/*.interceptor.ts"
      roles:
        - controller
        - module
        - gateway
        - guard
        - interceptor
      decorators:
        - "@Controller"
        - "@Module"

fitness_functions:

  # ── STRUCTURAL ──

  - id: FF-S01
    name: dependency-direction
    dimension: structural
    severity: critical
    route: symbolic
    validated: true

  - id: FF-S02
    name: no-cyclic-deps
    dimension: structural
    severity: critical
    route: symbolic
    validated: true

  - id: FF-S03
    name: no-layer-skip
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    # NestJS *.module.ts files are DI wiring — they import from all layers by design
    exclude_paths:
      - "**/*.module.ts"

  - id: FF-S04
    name: no-domain-outward-dep
    dimension: structural
    severity: major
    route: symbolic
    validated: false

  # ── PATTERN ──

  - id: FF-P01
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: true
    forbidden_imports:
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize

  - id: FF-P02
    name: dependency-inversion
    dimension: pattern
    severity: critical
    route: symbolic
    validated: true
    threshold: 0.85

  - id: FF-P03
    name: repository-pattern
    dimension: pattern
    severity: critical
    route: symbolic
    validated: true

  - id: FF-P04
    name: use-case-isolation
    dimension: pattern
    severity: major
    route: symbolic
    validated: true

  - id: FF-P05
    name: controller-no-entity
    dimension: pattern
    severity: major
    route: symbolic
    validated: false

  # FR-21 (U3-R6; BR-U3-22..24): domain class holding infrastructure state (FLOWS_TO | CONSTRUCTOR_INJECTS)
  - id: FF-P06
    name: domain-state-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false

  # ── COUPLING ──

  - id: FF-C01
    name: domain-stability
    dimension: coupling
    severity: major
    route: symbolic
    validated: true
    threshold: 0.3

  - id: FF-C02
    name: module-fan-out
    dimension: coupling
    severity: major
    route: symbolic
    validated: true
    threshold: 12

  - id: FF-C03
    name: component-instability
    dimension: coupling
    severity: major
    route: symbolic
    validated: true
    threshold: 0.8

  - id: FF-C04
    name: no-orphan-files
    dimension: coupling
    severity: minor
    route: symbolic
    validated: false

  - id: FF-C05
    name: max-fan-in
    dimension: coupling
    severity: minor
    route: symbolic
    validated: false
    threshold: 20

  - id: FF-C06
    name: abstraction-ratio
    dimension: coupling
    severity: advisory
    route: symbolic
    validated: false
    threshold: 0.3

  # ── SOLID ──

  - id: FF-SO01
    name: single-responsibility-proxy
    dimension: solid
    severity: major
    route: symbolic
    validated: true
    max_public_methods: 10
    max_dependencies: 5

  - id: FF-SO02
    name: interface-segregation-proxy
    dimension: solid
    severity: major
    route: symbolic
    validated: true
    max_interface_methods: 5

  - id: FF-SO03
    name: inheritance-depth
    dimension: solid
    severity: minor
    route: symbolic
    validated: false
    max_depth: 3

  # ── CONVENTION ──

  - id: FF-CV01
    name: naming-conventions
    dimension: convention
    severity: minor
    route: symbolic
    enabled: false
    reason: "ADR-016 b (B&T Step 31): cannot fire; per-layer naming patterns compile to .* and no requirement supplies them (SP-FF-CV01 not fired)"
    validated: true

  - id: FF-CV02
    name: naming-services
    dimension: convention
    severity: minor
    route: symbolic
    validated: false
    pattern: "*Service|*UseCase"

  - id: FF-CV03
    name: naming-repos
    dimension: convention
    severity: minor
    route: symbolic
    validated: false
    pattern: "*Repository|*Repo"

  - id: FF-CV04
    name: naming-controllers
    dimension: convention
    severity: minor
    route: symbolic
    enabled: false
    reason: "ADR-016 b (B&T Step 31): cannot fire; class decorators are not ingested (BR-U2-31), so no controller is selected (SP-FF-CV04 not fired)"
    validated: false
    pattern: "*Controller"

  - id: FF-CV05
    name: test-file-pairing
    dimension: convention
    severity: advisory
    route: symbolic
    validated: false

  - id: FF-CV06
    name: no-index-logic
    dimension: convention
    severity: advisory
    route: symbolic
    validated: false

  # ── NEURONAL ──

  - id: FF-N01
    name: architectural-integrity
    dimension: integrity
    severity: major
    route: neuronal
    validated: false
    semantic_criteria:
      rule: "The module's files form one coherent unit with a consistent abstraction and boundary."
      rubric:
        pass: "The files serve one cohesive concern, use the module's abstractions consistently, and keep each rule or invariant in one place."
        fail: "The files split into unrelated concerns, duplicate a rule or invariant that should live in one place, or bypass the module's own abstractions."
        evidence_required: "Name each file involved and cite the declarations that show the split, the duplication or the bypass."

  - id: FF-N02
    name: intent-alignment
    dimension: semantic
    severity: major
    route: neuronal
    validated: false
    semantic_criteria:
      rule: "The unit's responsibilities match the role of its declared layer."
      rubric:
        pass: "Every responsibility in the file belongs to the role and kind of its declared layer, and agrees with any ADR prose given."
        fail: "The file carries a responsibility that belongs to a different layer kind, for example persistence, transport or framework logic in a domain file, or business rules in an infrastructure or presentation file."
        evidence_required: "Name the file and cite the function, method or statement that carries the misplaced responsibility, and the layer kind it belongs to."

default_exclude_paths:
  - "node_modules/**"
  - "dist/**"
  - "**/*.spec.ts"
  - "**/*.test.ts"
  - "test/**"
  - "src/generated/**"

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
