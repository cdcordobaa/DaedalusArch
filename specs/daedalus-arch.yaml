spec_version: "1.0.0"

# AoC Specification — DaedalusArch Self-Evaluation
# Tailored for the Architectural Firewall's own codebase.
#
# Architecture: modular pipeline with Shared Kernel (DDD)
#   domain layer   = src/shared/** (types, interfaces, context, errors)
#   application    = src/pipeline/**, src/cli/** (orchestration, CLI)
#   modules        = src/apg-extractor/**, src/spec-parser/**, src/fitness-compiler/**,
#                    src/neo4j-ingestion/**, src/neuro-symbolic-router/**,
#                    src/evaluation-engine/**, src/llm-critic/**, src/scoring-engine/**

architecture:
  # No style template — all fitness functions are explicitly declared below
  # style: clean-architecture  # disabled: template auto-includes functions we don't want

  # Architecture: Shared Kernel + Modular Pipeline
  #
  # Layer hierarchy (top to bottom):
  #   application → core-modules → domain
  #
  # Dependency rules:
  #   - application (CLI, pipeline) can import from core-modules and domain
  #   - core-modules (all 8 pipeline modules + infra) can import from domain
  #   - core-modules can import from each other (peer modules — not a violation)
  #   - domain (shared kernel) imports nothing external
  #
  # This is a flat modular architecture, not a strict 3-layer hierarchy.
  # All pipeline modules are peers at the same layer.
  layers:
    - name: domain
      directories:
        - src/shared/**
      roles:
        - value-object
        - domain-service
        - repository-interface
        - context

    - name: core-modules
      directories:
        - src/apg-extractor/**
        - src/spec-parser/**
        - src/fitness-compiler/**
        - src/neo4j-ingestion/**
        - src/neuro-symbolic-router/**
        - src/evaluation-engine/**
        - src/llm-critic/**
        - src/scoring-engine/**
      roles:
        - module
        - service
        - repository-impl
        - provider-impl

    - name: application
      directories:
        - src/pipeline/**
        - src/cli/**
      roles:
        - orchestrator
        - command
        - cli-handler

fitness_functions:

  # ── STRUCTURAL ──────────────────────────────────────────────────────────────

  - id: FF-S01
    name: dependency-direction
    dimension: structural
    severity: critical
    route: symbolic

  - id: FF-S02
    name: no-cyclic-deps
    dimension: structural
    severity: critical
    route: symbolic

  # FF-S03 (no-layer-skip) DISABLED — only 3 layers, every cross-layer import is "adjacent"
  # Enable this for 4+ layer architectures where skipping layers is meaningful

  - id: FF-S04
    name: no-domain-outward-dep
    dimension: structural
    severity: major
    route: symbolic

  # ── PATTERN ─────────────────────────────────────────────────────────────────

  - id: FF-P01
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    forbidden_imports:
      - "neo4j-driver"
      - "@anthropic-ai/*"
      - "openai"
      - "commander"
      - "ora"
      - "chalk"

  - id: FF-P02
    name: dependency-inversion
    dimension: pattern
    severity: critical
    route: symbolic
    threshold: 0.85
    exclude_paths:
      - "src/pipeline/**"       # composition root wires concrete deps by design

  - id: FF-P03
    name: repository-pattern
    dimension: pattern
    severity: critical
    route: symbolic

  - id: FF-P04
    name: use-case-isolation
    dimension: pattern
    severity: major
    route: symbolic

  - id: FF-P05
    name: controller-no-entity
    dimension: pattern
    severity: major
    route: symbolic

  # ── COUPLING ─────────────────────────────────────────────────────────────────

  - id: FF-C01
    name: domain-stability
    dimension: coupling
    severity: major
    route: symbolic
    threshold: 0.3

  - id: FF-C02
    name: module-fan-out
    dimension: coupling
    severity: major
    route: symbolic
    threshold: 15              # raised from 10 — composition roots (factory) legitimately wire many deps
    exclude_paths:
      - "src/pipeline/pipeline-factory.ts"   # composition root — high fan-out by design

  - id: FF-C03
    name: component-instability
    dimension: coupling
    severity: advisory            # downgraded — shared kernel is intentionally stable (low instability)
    route: symbolic
    exclude_paths:
      - "src/shared/**"           # shared kernel SHOULD be maximally stable

  - id: FF-C04
    name: no-orphan-files
    dimension: coupling
    severity: advisory          # downgraded — index.ts barrel files may appear orphaned
    route: symbolic

  - id: FF-C05
    name: max-fan-in
    dimension: coupling
    severity: minor
    route: symbolic
    threshold: 20               # raised from 15 — shared kernel types are designed for high fan-in
    exclude_paths:
      - "src/shared/**"         # shared kernel — every module imports these by design

  - id: FF-C06
    name: abstraction-ratio
    dimension: coupling
    severity: advisory
    route: symbolic
    threshold: 0.25             # relaxed from 0.3 — CLI/pipeline modules are mostly concrete

  # ── SOLID ────────────────────────────────────────────────────────────────────

  - id: FF-SO01
    name: single-responsibility-proxy
    dimension: solid
    severity: major
    route: symbolic
    max_public_methods: 12      # slightly raised — some modules have richer public APIs
    max_dependencies: 7         # raised — pipeline commands legitimately depend on context + module

  - id: FF-SO02
    name: interface-segregation-proxy
    dimension: solid
    severity: major
    route: symbolic
    max_interface_methods: 7    # raised from 5 — SnapshotStore has 6 methods by design

  - id: FF-SO03
    name: inheritance-depth
    dimension: solid
    severity: minor
    route: symbolic
    max_depth: 3

  # ── CONVENTION ───────────────────────────────────────────────────────────────

  - id: FF-CV01
    name: naming-conventions
    dimension: convention
    severity: minor
    route: symbolic

  - id: FF-CV02
    name: naming-services
    dimension: convention
    severity: minor
    route: symbolic
    pattern: "*Service"

  - id: FF-CV03
    name: naming-repos
    dimension: convention
    severity: minor
    route: symbolic
    pattern: "*Repository|*Repo|*Store"   # added Store — FileSystemSnapshotStore

  - id: FF-CV04
    name: naming-controllers
    dimension: convention
    severity: advisory          # downgraded — this project has no controllers
    route: symbolic
    pattern: "*Controller|*Handler"

  - id: FF-CV05
    name: test-file-pairing
    dimension: convention
    severity: advisory
    route: symbolic

  - id: FF-CV06
    name: no-index-logic
    dimension: convention
    severity: advisory
    route: symbolic

  # ── NEURONAL (full evaluation mode only) ─────────────────────────────────────

  - id: FF-N01
    name: srp-semantic
    dimension: solid
    severity: major
    route: hybrid
    semantic_criteria:
      rule: "A class should have exactly one reason to change"
      rubric:
        pass: "Class responsibilities are cohesive and serve a single purpose"
        fail: "Class mixes unrelated concerns (data access + business logic, etc.)"
        evidence_required: "Cite specific methods that indicate mixed responsibilities"

  - id: FF-N02
    name: layering-intent
    dimension: intent
    severity: major
    route: neuronal
    semantic_criteria:
      rule: "Code should respect the documented architectural intent"
      rubric:
        pass: "File is in the correct layer and dependencies respect layer boundaries"
        fail: "File logic or dependencies contradict the architectural layer it lives in"
        evidence_required: "Cite the specific import or logic that violates the intent"

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    intent: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
