# CHECK-2 evaluation spec for the ddd-insurance base: presets/ddd.yaml with (1) the `architecture.ddd` block describing
# this project's contexts and aggregates and (2) the judged functions FF-N01 and FF-N02, which the preset does not declare,
# copied verbatim from presets/layered.yaml (the judge v2 / v2.2 rubric replaces their rubric text at run time). Every
# other line is the preset's.
# Architectonic Firewall — Domain-Driven Design Preset (v1.3, FR-V4)
# Rule definitions, literature sources (Evans 2003, Vernon 2013) and tier reasons: Docs/v1.3-ddd-notes.md.
#
# The extractor cannot tell which directory is a bounded context or which file is an aggregate root, so those facts
# are declared in `architecture.ddd` (read by the ddd style only). The declarations below describe the DDD reference
# project (tests/fixtures/v1.3-reference/ddd): replace them with your own contexts and aggregates. The layer globs and
# role globs are conventions (src/<context>/{domain,application,infrastructure,acl,api}/...) and usually carry over.
#
# Two kinds of rule:
#   - DDD rules (FF-DS.., FF-DT..), templates outside the frozen CYPHER_TEMPLATES (src/fitness-compiler/ddd-templates.ts);
#   - the hexagonal graph layering composed inside each context (FF-S01, FF-S03; allowed_dependencies below).
# Every function carries `tier` (ddd style only), as sealed in Docs/v1.3/rule-tiers.md before any measurement. Scoring
# does not read it yet (FR-V6). FR-07 values: FF-DT04 extends the layered forbidden list; FF-DT06 threshold 3 (a priori, notes §1).

spec_version: "1.0.0"

architecture:
  style: ddd

  layers:
    - name: domain
      kind: domain
      directories:
        - src/*/domain/**
        - src/shared-kernel/**
      roles:
        - aggregate
        - entity
        - value-object
        - domain-event
        - repository-interface

    - name: application
      kind: application
      directories:
        - src/*/application/**
      roles:
        - application-service
        - port

    - name: infrastructure
      kind: infrastructure
      directories:
        - src/*/infrastructure/**
        - src/*/acl/**
      roles:
        - repository
        - anti-corruption-layer

    - name: api
      kind: presentation
      directories:
        - src/*/api/**
      roles:
        - controller

    # Composition root, outside every context. kind application is only a placeholder for the kind resolver.
    - name: composition
      kind: application
      directories:
        - src/main.ts
      roles:
        - composition-root

  # Layering inside each context (`from` may import each layer in `to`); cross-context imports are FF-DS02's.
  allowed_dependencies:
    - from: application
      to: [domain]
    - from: infrastructure
      to: [application, domain]
    - from: api
      to: [application, domain]
    - from: composition
      to: [domain, application, infrastructure, api]

  ddd:
    source_root: src/
    contexts:
      - name: policies
        root: src/policies/
        public_api: [src/policies/index.ts, src/policies/contracts/**]
        acl: []
      - name: claims
        root: src/claims/
        public_api: []
        acl: [src/claims/acl/**]
    outside_contexts: [src/shared-kernel/**, src/main.ts]
    aggregates:
      - name: Policy
        context: policies
        module: src/policies/domain/policy/**
        root: src/policies/domain/policy/Policy.ts
        inner_entities: [src/policies/domain/policy/Coverage.ts]
      - name: Claim
        context: claims
        module: src/claims/domain/claim/**
        root: src/claims/domain/claim/Claim.ts
        inner_entities: []
    value_objects: ["src/**/value-objects/**", src/shared-kernel/Money.ts]
    repositories: ["src/*/domain/**/*Repository.ts", "src/*/infrastructure/**/*Repository.ts"]
    domain_event_types: [DomainEvent]
    application_services: ["src/*/application/*.ts"]

fitness_functions:

  # ── STRATEGIC ──

  - id: FF-DS01
    name: bounded-context-modules
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DS02
    name: context-isolation
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # ── TACTICAL ──

  - id: FF-DT01
    name: aggregate-boundary
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  - id: FF-DT02
    name: repository-aggregate-root
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Blocking per the sealed Docs/v1.3/rule-tiers.md. The check is still a method-name proxy (the extractor sees no
  # readonly, accessors or visibility); see Docs/v1.3-ddd-notes.md §2 for the proposed ADR.
  - id: FF-DT03
    name: value-object-immutability
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Framework-free domain: the existing domain-purity template, unchanged, with the DDD package list.
  - id: FF-DT04
    name: domain-purity
    dimension: pattern
    severity: critical
    route: symbolic
    validated: false
    tier: blocking
    forbidden_imports:
      - "@nestjs/*"
      - typeorm
      - express
      - prisma
      - "@prisma/*"
      - sequelize
      - mongoose
      - "@mikro-orm/*"
      - class-validator
      - class-transformer
      - inversify
      - tsyringe

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (placement guideline).
  - id: FF-DT05
    name: domain-event-placement
    dimension: pattern
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # Advisory heuristic: more methods than the threshold in an application service.
  - id: FF-DT06
    name: application-service-thin
    dimension: pattern
    severity: advisory
    route: symbolic
    validated: false
    tier: advisory
    threshold: 3

  # ── LAYERING INSIDE EACH CONTEXT (hexagonal templates) ──

  - id: FF-S01
    name: dependency-direction-graph
    dimension: structural
    severity: critical
    route: symbolic
    validated: false
    tier: blocking

  # Advisory per the sealed Docs/v1.3/rule-tiers.md (hexagonal does not define strict layering).
  - id: FF-S03
    name: layer-skip-graph
    dimension: structural
    severity: minor
    route: symbolic
    validated: false
    tier: advisory

  # ── JUDGED (CHECK-2 addition: FF-N01 and FF-N02 copied verbatim from presets/layered.yaml; tier advisory) ──

  - id: FF-N01
    name: architectural-integrity
    dimension: integrity
    severity: major
    route: neuronal
    validated: false
    tier: advisory
    semantic_criteria:
      rule: "The module's files form one coherent unit with a consistent abstraction and boundary."
      rubric:
        pass: "The files serve one cohesive concern, use the module's abstractions consistently, and keep each rule or invariant in one place."
        fail: "The files split into unrelated concerns, duplicate a rule or invariant that should live in one place, or bypass the module's own abstractions."
        evidence_required: "Name each file involved and cite the declarations that show the split, the duplication or the bypass."

  - id: FF-N02
    name: intent-alignment
    dimension: semantic
    severity: major
    route: neuronal
    validated: false
    tier: advisory
    semantic_criteria:
      rule: "The unit's responsibilities match the role of its declared layer."
      rubric:
        pass: "Every responsibility in the file belongs to the role and kind of its declared layer, and agrees with any ADR prose given."
        fail: "The file carries a responsibility that belongs to a different layer kind, for example persistence, transport or framework logic in a domain file, or business rules in an infrastructure or presentation file."
        evidence_required: "Name the file and cite the function, method or statement that carries the misplaced responsibility, and the layer kind it belongs to."

scoring:
  weights:
    structural: 0.35
    coupling: 0.20
    pattern: 0.30
    solid: 0.10
    convention: 0.05

  full_mode_weights:
    structural: 0.32
    coupling: 0.18
    pattern: 0.27
    solid: 0.10
    convention: 0.05
    semantic: 0.04
    integrity: 0.04

  thresholds:
    pass: 0.80
    warning: 0.65
    soft_block: 0.50

confidence_thresholds:
  high: 0.85
  medium: 0.60
  icc_minimum: 0.70
